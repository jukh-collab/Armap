nt:center;font-size:1.4rem;color:var(--muted);cursor:pointer;border-style:dashed;margin:0}\n.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.tile{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center}\n.tile b{display:block;font-size:1.25rem;color:var(--accent)}.tile span{font-size:.72rem;color:var(--muted)}\n.sp{padding:0;overflow:hidden}.sp-body{padding:16px}\n.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#000}\n.sl{position:relative;aspect-ratio:1;overflow:hidden;background:rgba(255,255,255,.06)}\n.sl img{width:100%;height:100%;object-fit:cover;display:block}\n.sl button{position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;line-height:1}\n.sl.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:1.3rem;cursor:pointer;margin:0}\n.sl.add span{font-size:.75rem}\n.sl.wide{grid-column:1/-1;aspect-ratio:auto;height:96px}\n.sp-head{display:flex;gap:14px;align-items:center}\n.avw{position:relative;width:84px;height:84px;flex:none}\n.av2{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:rgba(255,255,255,.06)}\n.cam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0;font-size:.9rem}\n.card .sp-name{border:0;margin:0 0 2px;padding:0;font-size:1.5rem}\n.cnt{display:flex;align-items:flex-end;gap:20px;margin:16px 0 12px}\n.cnt span{display:block;font-size:.75rem;color:var(--accent)}.cnt b{font-size:1.5rem}\n.cnt .btn{width:auto;margin:0 0 0 auto;padding:9px 16px;font-size:.85rem;background:transparent;color:var(--accent);border:1.5px solid var(--accent)}\n.pills{display:flex;gap:8px;margin-bottom:14px}\n.pill{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:600;cursor:pointer}\n.pill.on{border-color:var(--accent);color:var(--accent)}\n.sx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}\n.sx span{display:block;font-size:.78rem;color:var(--muted)}.sx b{font-size:1.5rem}\n.chart{width:100%;height:auto;display:block}\n.rowl{cursor:pointer}\n.pin{position:relative}\n.crown{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:15px;line-height:1}\n.kb{display:inline-block;font-size:.7rem;font-weight:700;vertical-align:middle;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--accent);color:#000}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n<nav>\n<button class=\"tab\" data-t=\"profil\">Profil<\/button>\n<button class=\"tab\" data-t=\"duel\">Défier<\/button>\n<button class=\"tab\" data-t=\"map\">Carte<\/button>\n<button class=\"tab\" data-t=\"rank\">Classement<\/button>\n<button class=\"tab\" data-t=\"lvls\">Niveaux<\/button>\n<\/nav>\n<main id=\"view\"><\/main>\n<p class=\"muted\" style=\"text-align:center;margin:8px 0 16px\">Prototype : adversaires simulés, données gardées sur cet appareil. La vraie version validera chaque duel par QR code et confirmation des deux joueurs.<\/p>\n<\/div>\n<script>\nconst LV=[[\"Débutant\",0],[\"Poignet de bois\",100],[\"Apprenti\",250],[\"Costaud\",450],[\"Combattant\",700],[\"Briseur de bras\",1000],[\"Titan\",1400],[\"Légende\",2000]];\nconst SEED=[\n{name:\"Karim\",sex:\"H\",arm:\"D\",weight:92,height:183,grip:58},\n{name:\"Léa\",sex:\"F\",arm:\"G\",weight:62,height:168,grip:32},\n{name:\"Thomas\",sex:\"H\",arm:\"D\",weight:78,height:178,grip:46},\n{name:\"Sophie\",sex:\"F\",arm:\"D\",weight:70,height:172,grip:38},\n{name:\"Marc\",sex:\"H\",arm:\"D\",weight:105,height:190,grip:65}];\nconst $=id=>document.getElementById(id);\nconst lvl=x=>{let i=0;LV.forEach((l,k)=>{if(x>=l[1])i=k});return i};\nconst power=p=>Math.round((p.grip||40)*2.5+p.weight*.6+(p.height-150)*.3);\nconst baseRating=p=>Math.round(1000+(power(p)-153)*3);\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst proba=(a,b)=>1/(1+Math.pow(10,(b-a)/400));\nconst wband=w=>{const a=Math.floor(w/10)*10;return a+\"-\"+(a+9)+\" kg\"};\nlet S={me:null,opps:[],hist:[]};\ntry{const r=localStorage.getItem(\"armarena\");if(r)S=JSON.parse(r)}catch(e){}\nconst GEO={\"Karim\":[700,8,3],\"Léa\":[120,-6,7],\"Thomas\":[460,2,-9],\"Sophie\":[260,-10,-4],\"Marc\":[1050,14,10]};\nif(!S.opps||!S.opps.length)S.opps=SEED.map((o,i)=>({...o,id:\"o\"+i,rating:baseRating(o)}));\nS.opps.forEach(o=>{const g=GEO[o.name];if(g&&o.xp===undefined){o.xp=g[0];o.dx=g[1];o.dy=g[2]}});\nS.opps.forEach(o=>{if(o.name===\"Karim\"&&!(o.lw&&o.lw.ids))o.lw={ids:[\"a\",\"b\",\"c\",\"d\",\"e\"]}});\nS.hist=S.hist||[];S.contacts=S.contacts||{};Object.keys(S.contacts).forEach(k=>{if(S.contacts[k]===\"pending\")delete S.contacts[k]});\nconst save=()=>{try{localStorage.setItem(\"armarena\",JSON.stringify(S))}catch(e){}};\nlet tab=\"profil\",editing=false,duelOpp=null,result=null,mapObj=null,lvFilter=\"all\",selId=null;\n\nfunction stat(l,v,max,u){return `<div class=\"stat\"><span>${l}<\/span><div class=\"bar\"><i style=\"width:${Math.min(100,v/max*100)}%\"><\/i><\/div><b>${v}${u||\"\"}<\/b><\/div>`}\n\nfunction formHtml(){\n const m=S.me||{sex:\"H\",arm:\"D\"};\n const f=(id,l,v,ph,st)=>`<div class=\"g\"><label>${l}<\/label><input id=\"${id}\" type=\"number\" inputmode=\"decimal\" step=\"${st||1}\" value=\"${v??\"\"}\" placeholder=\"${ph}\"><\/div>`;\n const sel=(a,b)=>a===b?\" selected\":\"\";\n return `<div class=\"card\"><h2>${S.me?\"Modifier mon profil\":\"Crée ton personnage\"}<\/h2>\n<p class=\"muted\" style=\"margin-bottom:12px\">Entre tes vraies données (poids, taille, force de préhension) : elles déterminent tes stats de combat.<\/p>\n<div class=\"g\"><label>Pseudo<\/label><input id=\"f-name\" maxlength=\"20\" value=\"${esc(m.name||\"\")}\"><\/div>\n<div class=\"row\"><div class=\"g\"><label>Sexe<\/label><select id=\"f-sex\"><option value=\"H\"${sel(m.sex,\"H\")}>Homme<\/option><option value=\"F\"${sel(m.sex,\"F\")}>Femme<\/option><\/select><\/div>\n<div class=\"g\"><label>Bras de combat<\/label><select id=\"f-arm\"><option value=\"D\"${sel(m.arm,\"D\")}>Droit<\/option><option value=\"G\"${sel(m.arm,\"G\")}>Gauche<\/option><\/select><\/div><\/div>\n<div class=\"row\">${f(\"f-weight\",\"Poids (kg)\",m.weight,\"75\")}${f(\"f-height\",\"Taille (cm)\",m.height,\"178\")}<\/div>\n${f(\"f-grip\",\"Force de préhension (kg, facultatif)\",m.grip||\"\",\"45\",\"0.5\")}\n<div class=\"err\" id=\"err\"><\/div>\n<button class=\"btn\" data-act=\"save\">${S.me?\"Enregistrer\":\"Créer mon personnage\"}<\/button>\n${S.me?'<button class=\"btn alt\" data-act=\"cancel\">Annuler<\/button>':\"\"}<\/div>`}\n\nfunction chart(a){\n if(!a||a.length<2)return '<p class=\"muted\" style=\"text-align:center;padding:26px 0\">Joue ton premier duel pour voir ta courbe de points.<\/p>';\n const W=300,H=110,P=34,mn=Math.min(...a),mx=Math.max(...a),r=(mx-mn)||1;\n const X=i=>P+i*(W-P-8)/(a.length-1),Y=v=>10+(H-20)*(1-(v-mn)/r);\n const pts=a.map((v,i)=>X(i).toFixed(1)+\",\"+Y(v).toFixed(1)),lx=X(a.length-1).toFixed(1),ly=Y(a[a.length-1]).toFixed(1);\n const gl=[mx,(mx+mn)/2,mn].map(v=>`<line x1=\"${P}\" x2=\"${W}\" y1=\"${Y(v).toFixed(1)}\" y2=\"${Y(v).toFixed(1)}\" stroke=\"rgba(255,255,255,.12)\"/><text x=\"0\" y=\"${(Y(v)+3).toFixed(1)}\" font-size=\"9\" fill=\"#94a3b8\">${Math.round(v)}<\/text>`).join(\"\");\n return `<svg class=\"chart\" viewBox=\"0 0 ${W} ${H+16}\" role=\"img\" aria-label=\"Évolution des points\">${gl}<polygon points=\"${P},${H-10} ${pts.join(\" \")} ${lx},${H-10}\" fill=\"rgba(245,158,11,.18)\"/><polyline points=\"${pts.join(\" \")}\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2\"/>${a.map((v,i)=>`<circle cx=\"${X(i).toFixed(1)}\" cy=\"${Y(v).toFixed(1)}\" r=\"2.5\" fill=\"#f59e0b\"/>`).join(\"\")}<circle cx=\"${lx}\" cy=\"${ly}\" r=\"5\" fill=\"#f59e0b\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"${P}\" y=\"${H+12}\" font-size=\"9\" fill=\"#94a3b8\">Évolution sur ${a.length-1} duel${a.length>2?\"s\":\"\"}<\/text><\/svg>`}\n\nfunction profilHtml(){\n const m=S.me,L=lvl(m.xp),nx=LV[L+1],pct=nx?(m.xp-LV[L][1])/(nx[1]-LV[L][1])*100:100;\n const all=[m,...S.opps].sort((a,b)=>b.rating-a.rating),rk=all.indexOf(m)+1,tot=m.w+m.l,g=m.gallery||[];\n const add=w=>`<label class=\"sl add${w?\" wide\":\"\"}\">📷<span>${w?\"Ajouter des photos\":\"Ajouter\"}<\/span><input type=\"file\" id=\"ph-add\" accept=\"image/*\" hidden><\/label>`;\n const strip=g.map((u,i)=>`<div class=\"sl\"><img src=\"${u}\" alt=\"Photo ${i+1}\"><button data-act=\"delph\" data-i=\"${i}\" aria-label=\"Supprimer la photo\">×<\/button><\/div>`).join(\"\")+(g.length<4?add(!g.length):\"\");\n const S3=(a,b,c)=>`<div class=\"sx\">${[a,b,c].map(x=>`<div><span>${x[0]}<\/span><b>${x[1]}<\/b><\/div>`).join(\"\")}<\/div>`;\n const duels=S3([\"Duels\",tot],[\"Victoires\",tot?Math.round(m.w/tot*100)+\" %\":\"–\"],[\"Classement\",\"#\"+rk])+chart(m.rh);\n const phys=S3([\"Prise\",m.grip?m.grip+\" kg\":\"–\"],[\"Poids\",m.weight+\" kg\"],[\"Taille\",m.height+\" cm\"])+stat(\"Puissance\",power(m),300);\n const hs=S.hist.slice(0,3);\n const lw=m.cell&&m.lw&&m.lw.k===cellKey(m.cell)?cnt(m):0,zl=!m.cell?\"Active la carte pour viser le titre Table King Local.\":isKing(m)?\"Tu es Table King Local\":`Ta zone : ${Math.min(lw,KING)}/${KING} adversaires battus pour devenir Table King Local`;\n return `<div class=\"card sp\"><div class=\"strip\">${strip}<\/div><div class=\"sp-body\">\n<div class=\"sp-head\"><div class=\"avw\">${m.photo?`<img class=\"av2\" src=\"${m.photo}\" alt=\"Photo de ${esc(m.name)}\">`:'<div class=\"av2\">💪<\/div>'}<label class=\"cam\" title=\"Changer ma photo\">📷<input type=\"file\" id=\"ph-main\" accept=\"image/*\" hidden><\/label><\/div>\n<div><h2 class=\"sp-name\">${esc(m.name)}${isKing(m)?' <span class=\"kb\">👑 Table King Local<\/span>':\"\"}<\/h2><div class=\"muted\">Bras ${m.arm===\"D\"?\"droit\":\"gauche\"} · ${m.weight} kg · ${m.height} cm<\/div><div class=\"title\">Niv. ${L+1} · ${LV[L][0]}<\/div><div class=\"muted\">${zl}<\/div><\/div><\/div>\n<div class=\"cnt\"><div><span>Victoires<\/span><b>${m.w}<\/b><\/div><div><span>Défaites<\/span><b>${m.l}<\/b><\/div><div><span>Points<\/span><b>${m.rating}<\/b><\/div><button class=\"btn\" data-act=\"edit\">Modifier<\/button><\/div>\n<div class=\"xp\"><i style=\"width:${pct}%\"><\/i><\/div>\n<div class=\"muted\">${m.xp} XP${nx?` · encore ${nx[1]-m.xp} XP pour « ${nx[0]} »`:\" · niveau maximum\"}<\/div><\/div><\/div>\n<div class=\"card\"><div class=\"pills\"><button class=\"pill${ptab===\"duels\"?\" on\":\"\"}\" data-act=\"ptab\" data-v=\"duels\">Duels<\/button><button class=\"pill${ptab===\"phys\"?\" on\":\"\"}\" data-act=\"ptab\" data-v=\"phys\">Physique<\/button><\/div>\n<h2>${ptab===\"duels\"?\"Bilan global\":\"Données physiques\"}<\/h2>${ptab===\"duels\"?duels:phys}<\/div>\n<div class=\"card\"><h2>Derniers duels<\/h2>${hs.length?hs.map(h=>`<div class=\"li\"><span>${h.win?\"Victoire\":\"Défaite\"} contre ${esc(h.o)}<\/span><span class=\"muted\">+${h.xp} XP<\/span><\/div>`).join(\"\"):'<p class=\"muted\">Aucun duel pour l’instant.<\/p>'}\n<div class=\"li rowl\" data-act=\"gotab\" data-t=\"rank\"><span>Voir le classement<\/span><span class=\"muted\">›<\/span><\/div><\/div>`}\n\nfunction duelHtml(){\n const m=S.me;\n if(result){const r=result;return `<div class=\"card res\"><div class=\"big\" style=\"color:var(${r.win?\"--good\":\"--bad\"})\">${r.win?\"Victoire !\":\"Défaite\"}<\/div>\n<p>Face à ${esc(r.o)}<\/p><p style=\"margin:8px 0\"><b class=\"title\">+${r.gain} XP<\/b> · ${r.dr>=0?\"+\":\"\"}${r.dr} pts<\/p>\n${r.up?`<p class=\"title\" style=\"margin:8px 0\">Niveau débloqué : ${r.up} !<\/p>`:\"\"}${r.king?'<p class=\"title\" style=\"margin:8px 0\">👑 Tu deviens Table King Local !<\/p>':\"\"}${r.already?'<p class=\"muted\" style=\"margin:8px 0\">Adversaire déjà battu dans ta zone : sa victoire ne compte qu’une fois pour le titre.<\/p>':\"\"}\n<button class=\"btn\" data-act=\"again\">Nouveau duel<\/button><\/div>`}\n if(duelOpp){const o=S.opps.find(x=>x.id===duelOpp),p=Math.round(proba(m.rating,o.rating)*100);\n const row=(l,a,b,u)=>`<div class=\"cmp\"><b>${a}${u||\"\"}<\/b><span>${l}<\/span><b>${b}${u||\"\"}<\/b><\/div>`;\n return `<div class=\"card\"><div class=\"vs\"><div><b>${esc(m.name)}<\/b><div class=\"muted\">${m.rating} pts<\/div><\/div><div class=\"big\">VS<\/div><div><b>${esc(o.name)}<\/b><div class=\"muted\">${o.rating} pts<\/div><\/div><\/div>\n${row(\"Puissance\",power(m),power(o))}${row(\"Poids\",m.weight+\" kg\",wband(o.weight))}${row(\"Taille\",m.height,o.height,\" cm\")}${row(\"Prise\",m.grip||\"–\",o.grip,\" kg\")}\n<div class=\"proba\">Tes chances de victoire : <b>${p} %<\/b><\/div>\n<p class=\"muted\" style=\"text-align:center;margin-bottom:8px\">Après le match, indique le résultat.<\/p>\n<button class=\"btn win\" data-act=\"win\">J’ai gagné<\/button><button class=\"btn lose\" data-act=\"lose\">J’ai perdu<\/button>\n<button class=\"btn alt\" data-act=\"back\">Choisir un autre adversaire<\/button><\/div>`}\n return `<div class=\"card\"><h2>Choisis ton adversaire<\/h2>${S.opps.map(o=>`<div class=\"li\"><div><b>${esc(o.name)}<\/b>${isKing(o)?\" 👑\":\"\"}<div class=\"muted\">${wband(o.weight)} · puissance ${power(o)} · ${o.rating} pts<\/div><\/div><button class=\"btn sm\" data-act=\"pick\" data-id=\"${o.id}\">Défier<\/button><\/div>`).join(\"\")}<\/div>`}\n\nfunction rankHtml(){\n const m=S.me,all=[{...m,me:1},...S.opps].sort((a,b)=>b.rating-a.rating);\n return `<div class=\"card\"><h2>Classement<\/h2>${all.map((p,i)=>`<div class=\"li${p.me?\" me\":\"\"}\"><span>${i+1}. ${esc(p.name)}${isKing(p)?\" 👑\":\"\"}<\/span><b>${p.rating} pts<\/b><\/div>`).join(\"\")}<\/div>\n<div class=\"card\"><h2>Derniers duels<\/h2>${S.hist.length?S.hist.map(h=>`<div class=\"li\"><span>${h.win?\"Victoire\":\"Défaite\"} contre ${esc(h.o)}<\/span><b style=\"color:var(${h.win?\"--good\":\"--bad\"})\">+${h.xp} XP<\/b><\/div>`).join(\"\"):'<p class=\"muted\">Aucun duel pour l’instant. Défie un adversaire pour démarrer.<\/p>'}<\/div>`}\n\nfunction lvlsHtml(){\n const L=lvl(S.me.xp);\n return `<div class=\"card\"><h2>Niveaux<\/h2>${LV.map((l,i)=>`<div class=\"li${i>L?\" lock\":\"\"}${i===L?\" me\":\"\"}\"><span>${i<=L?\"✅\":\"🔒\"} Niv. ${i+1} · ${l[0]}<\/span><span class=\"muted\">${l[1]} XP<\/span><\/div>`).join(\"\")}<\/div>`}\n\nfunction render(){\n if(mapObj){mapObj.remove();mapObj=null}\n document.querySelectorAll(\".tab\").forEach(b=>b.classList.toggle(\"on\",b.dataset.t===tab));\n $(\"view\").innerHTML=(!S.me||editing)?formHtml():({profil:profilHtml,duel:duelHtml,map:mapHtml,rank:rankHtml,lvls:lvlsHtml})[tab]();\n if(S.me&&!editing&&tab===\"map\")initMap();\n}\n\nfunction resolve(win){\n const m=S.me,o=S.opps.find(x=>x.id===duelOpp),E=proba(m.rating,o.rating);\n const dr=Math.round(32*((win?1:0)-E));\n const gain=win?30+Math.max(0,Math.min(40,Math.round((o.rating-m.rating)/10))):10;\n const before=lvl(m.xp),wasKing=isKing(m),already=!!(win&&m.cell&&m.lw&&m.lw.ids&&m.lw.k===cellKey(m.cell)&&m.lw.ids.includes(o.id));\n m.xp+=gain;m.rating+=dr;o.rating-=dr;win?m.w++:m.l++;\n m.rh=m.rh||[m.rating-dr];m.rh.push(m.rating);m.rh=m.rh.slice(-20);\n if(win&&isLocal(o)){const k=cellKey(m.cell);if(!m.lw||m.lw.k!==k||!m.lw.ids)m.lw={k,ids:[]};if(!m.lw.ids.includes(o.id))m.lw.ids.push(o.id)}\n S.hist.unshift({o:o.name,win,xp:gain});S.hist=S.hist.slice(0,8);\n const after=lvl(m.xp);\n result={win,gain,dr,o:o.name,up:after>before?LV[after][0]:null,king:!wasKing&&isKing(m),already};\n save();\n}\n\nfunction saveProfile(){\n const n=id=>parseFloat($(id).value),ok=(x,a,b)=>x>=a&&x<=b;\n const d={name:$(\"f-name\").value.trim(),sex:$(\"f-sex\").value,arm:$(\"f-arm\").value,weight:n(\"f-weight\"),height:n(\"f-height\"),grip:n(\"f-grip\")};\n if(isNaN(d.grip))d.grip=0;\n if(!d.name||!ok(d.weight,30,200)||!ok(d.height,120,230)||!ok(d.grip,0,120)){\n  $(\"err\").textContent=\"Vérifie le pseudo, le poids et la taille : chaque champ doit contenir une valeur réaliste.\";return}\n if(S.me)Object.assign(S.me,d);else S.me={...d,xp:0,w:0,l:0,rating:baseRating(d)};\n editing=false;tab=\"profil\";save();render();\n}\n\n$(\"view\").addEventListener(\"click\",e=>{\n const a=e.target.closest(\"[data-act]\");if(!a)return;\n const k=a.dataset.act;\n if(k===\"save\")return saveProfile();\n if(k===\"cancel\")editing=false;\n if(k===\"edit\")editing=true;\n if(k===\"pick\")duelOpp=a.dataset.id;\n if(k===\"back\")duelOpp=null;\n if(k===\"win\"||k===\"lose\")resolve(k===\"win\");\n if(k===\"again\"){result=null;duelOpp=null}\n if(k===\"delph\"){S.me.gallery.splice(+a.dataset.i,1);save()}\n if(k===\"ptab\")ptab=a.dataset.v;\n if(k===\"gotab\"){tab=a.dataset.t;duelOpp=null;result=null}\n if(k===\"ask\")return askDuel(a.dataset.id);\n if(k===\"go\"){tab=\"duel\";duelOpp=a.dataset.id;result=null}\n render();\n});\ndocument.querySelectorAll(\".tab\").forEach(b=>b.addEventListener(\"click\",()=>{tab=b.dataset.t;duelOpp=null;result=null;editing=false;render()}));\nconst CELL=10,DEF={lat:43.2965,lng:5.3698};\nlet ptab=\"duels\";\nconst KING=4,cellKey=c=>c.lat.toFixed(3)+\",\"+c.lng.toFixed(3);\nfunction oppPos(o){const b=S.me.cell||DEF;return snap(b.lat+o.dy/111,b.lng+o.dx/kmLng(b.lat))}\nfunction isLocal(o){const c=S.me.cell;if(!c)return false;const p=oppPos(o);return Math.hypot((p.lng-c.lng)*kmLng(c.lat),(p.lat-c.lat)*111)<=15}\nconst cnt=p=>p.lw&&p.lw.ids?p.lw.ids.length:0;\nfunction isKing(p){if(p.me||p===S.me)return !!(S.me.cell&&p.lw&&p.lw.k===cellKey(S.me.cell)&&cnt(p)>=KING);return cnt(p)>=KING}\nfunction readImg(file,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement(\"canvas\");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext(\"2d\").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(\"image/jpeg\",.8))};im.onerror=()=>cb(null);im.src=r.result};r.onerror=()=>cb(null);r.readAsDataURL(file)}\nconst kmLng=lat=>111*Math.cos(lat*Math.PI/180);\nfunction snap(lat,lng){const dl=CELL/111,la=(Math.floor(lat/dl)+.5)*dl,dg=CELL/kmLng(la);return{lat:la,lng:(Math.floor(lng/dg)+.5)*dg}}\nfunction circle(c,r){const pts=[];for(let i=0;i<=48;i++){const a=i/48*2*Math.PI;pts.push([c.lng+r/kmLng(c.lat)*Math.cos(a),c.lat+r/111*Math.sin(a)])}return pts}\nfunction mapHtml(){\n return `<div class=\"card\"><h2>Carte des combattants<\/h2>\n<label class=\"li\" style=\"cursor:pointer\"><span>Apparaître sur la carte<div class=\"muted\">Ta position est arrondie sur ton appareil : seule une zone d’environ 5 km de rayon est enregistrée, jamais ta position exacte.<\/div><\/span><input type=\"checkbox\" id=\"vis\" style=\"width:auto\"${S.me.cell?\" checked\":\"\"}><\/label>\n<div class=\"g\" style=\"margin:12px 0 8px\"><label>Filtrer par niveau<\/label><select id=\"lvf\"><option value=\"all\">Tous les niveaux<\/option><option value=\"near\">Mon niveau ±1<\/option><\/select><\/div>\n<div id=\"map\"><\/div><div class=\"err\" id=\"merr\"><\/div><div id=\"sel\"><\/div><\/div>`}\nfunction initMap(){\n $(\"lvf\").value=lvFilter;\n if(typeof L===\"undefined\"){$(\"merr\").textContent=\"La carte n’a pas pu se charger : vérifie ta connexion internet.\";return}\n const base=S.me.cell||DEF,lv=lvl(S.me.xp);\n const zones=S.opps.filter(o=>lvFilter===\"all\"||Math.abs(lvl(o.xp)-lv)<=1).map(o=>({o,me:0,c:snap(base.lat+o.dy/111,base.lng+o.dx/kmLng(base.lat))}));\n if(S.me.cell)zones.push({o:S.me,me:1,c:S.me.cell});\n try{mapObj=L.map(\"map\").setView([base.lat,base.lng],10)}catch(err){$(\"merr\").textContent=\"Carte impossible à afficher : \"+err.message;return}\n L.tileLayer(\"https://tile.openstreetmap.org/{z}/{x}/{y}.png\",{maxZoom:18,attribution:'© <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap<\/a>'}).addTo(mapObj);\n zones.forEach(z=>{\n  L.circle([z.c.lat,z.c.lng],{radius:5000,color:\"#d97706\",weight:1.5,fillColor:\"#f59e0b\",fillOpacity:.25,interactive:false}).addTo(mapObj);\n  const n=lvl(z.o.xp)+1;\n  const ic=L.divIcon({className:\"\",html:`<div class=\"pin${z.me?\" me\":\"\"}\" title=\"${z.me?\"Toi\":\"Niveau \"+n}\">${isKing(z.o)?'<span class=\"crown\">👑<\/span>':\"\"}${n}<\/div>`,iconSize:[32,32],iconAnchor:[16,16]});\n  const mk=L.marker([z.c.lat,z.c.lng],{icon:ic,keyboard:false}).addTo(mapObj);\n  if(!z.me)mk.on(\"click\",()=>{selId=z.o.id;showSel()});\n });\n setTimeout(()=>{if(mapObj)mapObj.invalidateSize()},200);\n if(selId)showSel();\n}\nfunction showSel(){\n const o=S.opps.find(x=>x.id===selId),el=$(\"sel\");if(!o||!el)return;\n const st=S.contacts[o.id],L=lvl(o.xp);\n const act=st===\"ok\"?`<button class=\"btn sm\" data-act=\"go\" data-id=\"${o.id}\">Lancer le duel<\/button>`:st===\"pending\"?'<span class=\"muted\">Demande envoyée…<\/span>':st===\"no\"?'<span class=\"muted\">Refusé pour le moment<\/span>':`<button class=\"btn sm\" data-act=\"ask\" data-id=\"${o.id}\">Proposer un duel<\/button>`;\n el.innerHTML=`<div class=\"li\" style=\"margin-top:10px\"><div><b>${esc(o.name)}<\/b>${isKing(o)?\" 👑 Table King Local\":\"\"}<div class=\"muted\">Niv. ${L+1} · ${LV[L][0]} · puissance ${power(o)} · zone d’environ 5 km<\/div>${st===\"ok\"?'<div class=\"muted\">Demande acceptée : aucune coordonnée n’est partagée.<\/div>':\"\"}<\/div>${act}<\/div>`}\nfunction askDuel(id){\n S.contacts[id]=\"pending\";showSel();\n setTimeout(()=>{S.contacts[id]=Math.random()<.8?\"ok\":\"no\";save();if(tab===\"map\")showSel()},1800);\n}\nfunction setVis(on){\n if(!on){delete S.me.cell;save();return render()}\n if(!navigator.geolocation){$(\"merr\").textContent=\"La localisation n’est pas disponible sur cet appareil.\";$(\"vis\").checked
