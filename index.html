<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arm Arena</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#050811;--card:rgba(15,23,42,.92);--accent:#f59e0b;--text:#f8fafc;--muted:#94a3b8;--border:rgba(255,255,255,.15);--good:#22c55e;--bad:#ef4444;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050811;--text:#f8fafc}}
:root[data-theme="dark"]{--bg:#050811;--text:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:760px;margin:0 auto;padding:16px}
header{text-align:center;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);margin-bottom:14px}
h1{font-size:2rem;color:var(--accent);letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.9)}
header p{color:var(--muted);font-size:.85rem;margin-top:4px}
nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 8px;font-size:.78rem;flex:1 0 auto;cursor:pointer}
.tab.on{background:var(--accent);color:#000;font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.card h2{font-size:1.1rem;margin-bottom:12px;border-bottom:2px solid var(--border);padding-bottom:8px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:rgba(5,8,17,.9);color:var(--text);font-size:1rem}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g{margin-bottom:12px}
.btn{width:100%;padding:12px;border:0;border-radius:6px;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-top:6px}
.btn.sm{width:auto;padding:8px 14px;margin:0;font-size:.85rem}
.btn.alt{background:transparent;color:var(--muted);border:1px dashed var(--border);font-weight:400;font-size:.85rem}
.btn.win{background:var(--good)}.btn.lose{background:var(--bad);color:#fff}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.av{font-size:2.4rem;width:70px;height:70px;flex:none;border-radius:50%;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(245,158,11,.4)}
.hero h2{border:0;margin:0;padding:0;font-size:1.4rem}
.title{color:var(--accent);font-weight:700}
.hero>div{flex:1;min-width:0}
.xp,.bar{height:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 2px}
.xp i,.bar i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--muted);font-size:.8rem}
.stat{display:grid;grid-template-columns:100px 1fr 62px;gap:8px;align-items:center;font-size:.85rem}
.stat .bar{margin:0}.stat b{text-align:right}.stat+.stat{margin-top:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.li:last-child{border:0}.li.me{color:var(--accent);font-weight:700}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;text-align:center;align-items:center;margin-bottom:10px}
.vs .big{font-size:1.6rem;color:var(--accent);font-weight:800}
.cmp{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.cmp span{color:var(--muted);font-size:.78rem}
.res{text-align:center}.res .big{font-size:1.8rem;font-weight:800;margin-bottom:8px}
.lock{opacity:.45}
.proba{text-align:center;margin:12px 0;font-size:.95rem}.proba b{color:var(--accent);font-size:1.3rem}
@media (prefers-reduced-motion:no-preference){.xp i{transition:width .6s ease}}
#map{height:340px;border-radius:10px;border:1px solid var(--border);margin-top:4px}
.pin{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#000;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.7)}
.pin.me{background:var(--good)}
.prof{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}
@media (max-width:600px){.prof{grid-template-columns:1fr}}
.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:3px solid var(--accent);display:block;box-shadow:0 0 20px rgba(245,158,11,.35)}
.ph0{display:flex;align-items:center;justify-content:center;font-size:4rem;background:rgba(255,255,255,.05)}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.th{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:2px;right:2px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;line-height:1}
.th.add{display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--muted);cursor:pointer;border-style:dashed;margin:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center}
.tile b{display:block;font-size:1.25rem;color:var(--accent)}.tile span{font-size:.72rem;color:var(--muted)}
.sp{padding:0;overflow:hidden}.sp-body{padding:16px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#000}
.sl{position:relative;aspect-ratio:1;overflow:hidden;background:rgba(255,255,255,.06)}
.sl img{width:100%;height:100%;object-fit:cover;display:block}
.sl button{position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;line-height:1}
.sl.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:1.3rem;cursor:pointer;margin:0}
.sl.add span{font-size:.75rem}
.sl.wide{grid-column:1/-1;aspect-ratio:auto;height:96px}
.sp-head{display:flex;gap:14px;align-items:center}
.avw{position:relative;width:84px;height:84px;flex:none}
.av2{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:rgba(255,255,255,.06)}
.cam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0;font-size:.9rem}
.card .sp-name{border:0;margin:0 0 2px;padding:0;font-size:1.5rem}
.cnt{display:flex;align-items:flex-end;gap:20px;margin:16px 0 12px}
.cnt span{display:block;font-size:.75rem;color:var(--accent)}.cnt b{font-size:1.5rem}
.cnt .btn{width:auto;margin:0 0 0 auto;padding:9px 16px;font-size:.85rem;background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.pills{display:flex;gap:8px;margin-bottom:14px}
.pill{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:600;cursor:pointer}
.pill.on{border-color:var(--accent);color:var(--accent)}
.sx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.sx span{display:block;font-size:.78rem;color:var(--muted)}.sx b{font-size:1.5rem}
.chart{width:100%;height:auto;display:block}
.rowl{cursor:pointer}
.pin{position:relative}
.crown{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:15px;line-height:1}
.kb{display:inline-block;font-size:.7rem;font-weight:700;vertical-align:middle;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--accent);color:#000}
.modal{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mback{position:absolute;inset:0;background:rgba(0,0,0,.72)}
.mbox{position:relative;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.8)}
.mbox .sp-name{font-size:1.4rem;margin:0 0 2px}
.mclose{position:absolute;top:8px;right:10px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:var(--text);font-size:1.3rem;cursor:pointer;line-height:1;z-index:1}
.app.mapmode{max-width:none;padding:8px}
.app.mapmode .note{display:none}
.mbar{cursor:pointer;padding:6px 4px 10px;border-bottom:0}
.mbar input{width:24px;height:24px;flex:none}
#mapwrap{position:relative}
#map{height:calc(100vh - 175px);height:calc(100dvh - 175px);min-height:320px;margin-top:0}
.lvf{position:absolute;top:10px;right:10px;z-index:1000;width:auto;padding:6px 8px;font-size:.8rem;border-radius:6px}
.acts{display:flex;flex-direction:column;gap:6px}
.acts .btn{white-space:nowrap}
.btn.sm.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;width:90px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.85rem}
.av3{width:48px;height:48px;flex:none;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;background:rgba(255,255,255,.06);object-fit:cover}
.chip .btn{width:100%;padding:6px 4px;font-size:.75rem}
.post{padding:0;overflow:hidden}.pb{padding:14px}
.phd{display:flex;gap:10px;align-items:center}
.pic{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.vsr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin:12px 0 2px;font-size:.88rem}
.vsr span{display:block;color:var(--muted);font-size:.72rem}.vsr i{color:var(--accent);font-weight:800;font-style:normal}
.pf{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.like{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.like.on{border-color:var(--accent);color:var(--accent)}
.mbar label{flex:1;margin:0;cursor:pointer;color:var(--text);font-size:.95rem}
.prec{width:auto;flex:none;padding:6px 8px;font-size:.8rem;border-radius:6px}
.pr4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mv{padding:14px 0;border-bottom:1px solid var(--border)}.mv:last-child{border:0;padding-bottom:0}
.mvh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mvh b{font-size:1.05rem}.mvh small{display:block;color:var(--muted);font-size:.75rem}
.mvbest{font-size:1.6rem;font-weight:800;color:var(--accent);text-align:right}.mvbest small{display:inline;font-size:.7rem;color:var(--muted);font-weight:400}
.mvf{display:grid;grid-template-columns:84px 1fr auto;gap:8px;margin:10px 0 4px}
.mvf input{padding:8px}.mvf .btn{width:auto;margin:0;padding:8px 14px;font-size:.85rem}
.mvl{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;padding:3px 0;color:var(--muted)}
.mvl .del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 6px}
.res-chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:800;letter-spacing:.5px}
.res-chip.win{background:var(--good);color:#000}.res-chip.loss{background:var(--bad);color:#fff}
.sx b small{font-size:.7rem;color:var(--muted);font-weight:400}
.wrow{display:flex;gap:12px;align-items:center;margin-top:8px}
.gauge{width:110px;height:auto;flex:none;background:rgba(255,255,255,.04);border-radius:10px}
.wm{flex:1;min-width:0}
.wm div{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;padding:5px 0;border-bottom:1px solid var(--border)}
.wm div:last-child{border:0}.wm span{color:var(--muted)}
.bdgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.bdg{border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:700}
.conf{font-size:.75rem;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="app">
<nav>
<button class="tab" data-t="profil">Profil</button>
<button class="tab" data-t="table">Table</button>
<button class="tab" data-t="duel">Duel</button>
<button class="tab" data-t="map">Carte</button>
<button class="tab" data-t="rank">Classement</button>
<button class="tab" data-t="lvls">Niveaux</button>
</nav>
<main id="view"></main>
<p class="muted note" style="text-align:center;margin:8px 0 16px">Prototype : adversaires simulés, données gardées sur cet appareil. La vraie version validera chaque duel par QR code et confirmation des deux joueurs.</p>
</div>
<script>
const LV=[["Débutant",0],["Poignet de bois",100],["Apprenti",250],["Costaud",450],["Combattant",700],["Briseur de bras",1000],["Titan",1400],["Légende",2000]];
const SEED=[
{name:"Karim",sex:"H",arm:"D",weight:92,height:183,grip:58},
{name:"Léa",sex:"F",arm:"G",weight:62,height:168,grip:32},
{name:"Thomas",sex:"H",arm:"D",weight:78,height:178,grip:46},
{name:"Sophie",sex:"F",arm:"D",weight:70,height:172,grip:38},
{name:"Marc",sex:"H",arm:"D",weight:105,height:190,grip:65}];
const $=id=>document.getElementById(id);
const lvl=x=>{let i=0;LV.forEach((l,k)=>{if(x>=l[1])i=k});return i};
const power=p=>Math.round((p.grip||40)*2.5+p.weight*.6+(p.height-150)*.3);
const baseRating=p=>Math.round(1000+(power(p)-153)*3);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const proba=(a,b)=>1/(1+Math.pow(10,(b-a)/400));
const wband=w=>{const a=Math.floor(w/10)*10;return a+"-"+(a+9)+" kg"};
let S={me:null,opps:[],hist:[]};
try{const r=localStorage.getItem("armarena");if(r)S=JSON.parse(r)}catch(e){}
const GEO={"Karim":[700,2.5,1,14,3,5],"Léa":[120,-2,2.5,3,5,1.5],"Thomas":[460,.7,-3,8,6,5],"Sophie":[260,-3.5,-1.4,5,4,10],"Marc":[1050,5,3.5,19,2,5]};
if(!S.opps||!S.opps.length)S.opps=SEED.map((o,i)=>({...o,id:"o"+i,rating:baseRating(o)}));
S.opps.forEach(o=>{const g=GEO[o.name];if(g&&o.xp===undefined){o.xp=g[0];o.dx=g[1];o.dy=g[2]}});
S.opps.forEach(o=>{const g=GEO[o.name];if(g&&o.w===undefined){o.w=g[3];o.l=g[4]}});
S.opps.forEach(o=>{const g=GEO[o.name];if(g){o.dx=g[1];o.dy=g[2];o.pr=g[5]}});
S.opps.forEach(o=>{if(o.name==="Karim"&&!(o.lw&&o.lw.ids))o.lw={ids:["a","b","c","d","e"]}});
S.hist=S.hist||[];S.contacts=S.contacts||{};Object.keys(S.contacts).forEach(k=>{if(S.contacts[k]==="pending")delete S.contacts[k]});
const save=()=>{try{localStorage.setItem("armarena",JSON.stringify(S))}catch(e){}};
let tab="profil",editing=false,duelOpp=null,result=null,mapObj=null,lvFilter="all",selId=null;

function stat(l,v,max,u){return `<div class="stat"><span>${l}</span><div class="bar"><i style="width:${Math.min(100,v/max*100)}%"></i></div><b>${v}${u||""}</b></div>`}

function formHtml(){
 const m=S.me||{sex:"H",arm:"D"};
 const f=(id,l,v,ph,st)=>`<div class="g"><label>${l}</label><input id="${id}" type="number" inputmode="decimal" step="${st||1}" value="${v??""}" placeholder="${ph}"></div>`;
 const sel=(a,b)=>a===b?" selected":"";
 return `<div class="card"><h2>${S.me?"Modifier mon profil":"Crée ton personnage"}</h2>
<p class="muted" style="margin-bottom:12px">Entre tes vraies données (poids, taille, force de préhension) : elles déterminent tes stats de combat.</p>
<div class="g"><label>Pseudo</label><input id="f-name" maxlength="20" value="${esc(m.name||"")}"></div>
<div class="row"><div class="g"><label>Sexe</label><select id="f-sex"><option value="H"${sel(m.sex,"H")}>Homme</option><option value="F"${sel(m.sex,"F")}>Femme</option></select></div>
<div class="g"><label>Bras de combat</label><select id="f-arm"><option value="D"${sel(m.arm,"D")}>Droit</option><option value="G"${sel(m.arm,"G")}>Gauche</option></select></div></div>
<div class="row">${f("f-weight","Poids (kg)",m.weight,"75")}${f("f-height","Taille (cm)",m.height,"178")}</div>
${f("f-grip","Force de préhension (kg, facultatif)",m.grip||"","45","0.5")}
<div class="err" id="err"></div>
<button class="btn" data-act="save">${S.me?"Enregistrer":"Créer mon personnage"}</button>
${S.me?'<button class="btn alt" data-act="cancel">Annuler</button>':""}</div>`}

function chart(a){
 if(!a||a.length<2)return '<p class="muted" style="text-align:center;padding:26px 0">Joue ton premier duel pour voir ta courbe de points.</p>';
 const W=300,H=110,P=34,mn=Math.min(...a),mx=Math.max(...a),r=(mx-mn)||1;
 const X=i=>P+i*(W-P-8)/(a.length-1),Y=v=>10+(H-20)*(1-(v-mn)/r);
 const pts=a.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)),lx=X(a.length-1).toFixed(1),ly=Y(a[a.length-1]).toFixed(1);
 const gl=[mx,(mx+mn)/2,mn].map(v=>`<line x1="${P}" x2="${W}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(255,255,255,.12)"/><text x="0" y="${(Y(v)+3).toFixed(1)}" font-size="9" fill="#94a3b8">${Math.round(v)}</text>`).join("");
 return `<svg class="chart" viewBox="0 0 ${W} ${H+16}" role="img" aria-label="Évolution des points">${gl}<polygon points="${P},${H-10} ${pts.join(" ")} ${lx},${H-10}" fill="rgba(245,158,11,.18)"/><polyline points="${pts.join(" ")}" fill="none" stroke="#f59e0b" stroke-width="2"/>${a.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.5" fill="#f59e0b"/>`).join("")}<circle cx="${lx}" cy="${ly}" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="${P}" y="${H+12}" font-size="9" fill="#94a3b8">Évolution sur ${a.length-1} duel${a.length>2?"s":""}</text></svg>`}

function profilHtml(){
 const m=S.me,L=lvl(m.xp),nx=LV[L+1],pct=nx?(m.xp-LV[L][1])/(nx[1]-LV[L][1])*100:100;
 const all=[m,...S.opps].sort((a,b)=>b.rating-a.rating),rk=all.indexOf(m)+1,tot=m.w+m.l,g=m.gallery||[];
 const add=w=>`<label class="sl add${w?" wide":""}">📷<span>${w?"Ajouter des photos":"Ajouter"}</span><input type="file" id="ph-add" accept="image/*" hidden></label>`;
 const strip=g.map((u,i)=>`<div class="sl"><img src="${u}" alt="Photo ${i+1}"><button data-act="delph" data-i="${i}" aria-label="Supprimer la photo">×</button></div>`).join("")+(g.length<4?add(!g.length):"");
 const S3=(a,b,c)=>`<div class="sx">${[a,b,c].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div>`;
 const duels=S3(["Duels",tot],["Victoires",tot?Math.round(m.w/tot*100)+" %":"–"],["Classement","#"+rk])+chart(m.rh);
 const phys=S3(["Prise",m.grip?m.grip+" kg":"–"],["Poids",m.weight+" kg"],["Taille",m.height+" cm"])+stat("Puissance",power(m),300);
 const hs=S.hist.slice(0,3);

 if(win)o.l=(o.l||0)+1;else o.w=(o.w||0)+1;

 const L=46,cx=30,cy=60,t=Math.max(0,Math.min(tilt,100)),a=t*Math.PI/180,r=24;
 const ex=(cx+L*Math.sin(a)).toFixed(1),ey=(cy-L*Math.cos(a)).toFixed(1),ax=(cx+r*Math.sin(a)).toFixed(1),ay=(cy-r*Math.cos(a)).toFixed(1);
 return `<svg class="gauge" viewBox="0 0 100 70" role="img" aria-label="Inclinaison maximale de l’avant-bras : ${tilt} degrés"><line x1="4" y1="64" x2="96" y2="64" stroke="#d6a15c" stroke-width="3" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-L}" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${ax} ${ay}" fill="none" stroke="#f59e0b" stroke-width="2"/><line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="4" fill="#fff"/><text x="${cx+8}" y="${cy-30}" font-size="11" font-weight="700" fill="#f8f4f0">${tilt}°</text></svg>`}
function watchBlock(p){
 const w=p.w;if(!w)return "";
 const conf={both:"✅ Confirmé par les deux montres",one:"⏳ En attente de la montre de l’adversaire",manual:"✍️ Déclaré à la main",disputed:"⚠️ Contesté : les deux résultats diffèrent"}[w.conf||"one"];
 const prev=S.feed.filter(x=>x.who===p.who&&x.w&&x.t<p.t),best=k=>prev.reduce((m,x)=>Math.max(m,x.w[k]||0),0),bd=[];
 if(prev.length&&w.atk>best("atk"))bd.push("⚡ Record d’attaque");
 if(prev.length&&w.dur>best("dur"))bd.push("⏱️ Duel le plus long");
 if(prev.length&&w.hrMax>best("hrMax"))bd.push("💓 FC max record");
 const dur=w.dur>=60?Math.floor(w.dur/60)+" min "+(w.dur%60)+" s":w.dur+" s";
 return `<div class="sx" style="margin-top:12px"><div><span>Durée</span><b>${dur}</b></div><div><span>FC moyenne</span><b>${w.hrAvg}<small> bpm</small></b></div><div><span>FC max</span><b>${w.hrMax}<small> bpm</small></b></div></div>
<div class="wrow">${armGauge(w.tilt)}<div class="wm"><div><span>Attaque</span><b>${w.atk} °/s</b></div><div><span>Vitesse max</span><b>${w.gyro} °/s</b></div><div><span>Pic d’accélération</span><b>${w.acc} mg</b></div><div><span>Poignet</span><b>${w.wrist==="L"?"Gauche":"Droit"}</b></div></div></div>
${bd.length?`<div class="bdgs">${bd.map(x=>`<span class="bdg">${x}</span>`).join("")}</div>`:""}<div class="conf">${conf} · ⌚ Instinct 2</div>`}
function postHtml(p){
 const a=person(p.who),b=person(p.vs);if(!a||!b)return"";
 const la=lvl(a.xp),lb=lvl(b.xp),me=p.who==="me";
 const pic=p.pic===undefined||p.pic===null?"":typeof p.pic==="number"?picSvg(p.pic):p.pic;
 const side=(id,x,l,w)=>`<div><b>${esc(nm(id,x))}${w?" 🏆":""}</b><span>Niv. ${l+1} · ${LV[l][0]} · ${x.xp} XP</span></div>`;
 return `<div class="card post"><div class="pb"><div class="phd">${avatar(a,"av3")}<div><b>${esc(nm(p.who,a))}</b>${isKing(a)?" 👑":""} <span class="muted">· ${ago(p.t)}</span><div class="title" style="font-size:.8rem">Niv. ${la+1} · ${LV[la][0]}</div></div><span class="res-chip ${p.win?"win":"loss"}" style="margin-left:auto">${p.win?"VICTOIRE":"DÉFAITE"}</span></div>
<p style="margin:10px 0 0">${p.win?"a battu":"a perdu contre"} <b>${esc(nm(p.vs,b))}</b> · <span class="title">+${p.xp} XP</span></p>
<div class="vsr">${side(p.who,a,la,p.win)}<i>VS</i>${side(p.vs,b,lb,!p.win)}</div>${watchBlock(p)}</div>
${pic?`<img class="pic" src="${pic}" alt="Photo du duel">`:(me?`<label class="btn alt" style="display:block;width:auto;text-align:center;margin:0 14px 12px;cursor:pointer">📷 Ajouter une photo du duel<input type="file" id="ph-post-${p.id}" accept="image/*" hidden></label>`:"")}
${me&&!p.w?`<button class="btn alt" data-act="simw" data-id="${p.id}" style="display:block;width:auto;margin:0 14px 12px">⌚ Ajouter les données de ma montre (démo)</button>`:""}
<div class="pf"><button class="like${p.liked?" on":""}" data-act="like" data-id="${p.id}">♥ ${p.likes||0}</button><span class="muted">${me?"Publié sur ta Table":""}</span></div></div>`}
const MOVES=[["pron","Pronation","Static Pull"],["cup","Cupping","Wrist Flexion"],["ris","Rising","Radial Deviation"],["bp","Backpressure",""]];
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function spark(a){
 if(a.length<2)return '<p class="muted" style="margin:8px 0 0">Ajoute au moins 2 mesures pour voir ta courbe.</p>';
 const W=300,H=70,P=30,mn=Math.min(...a),mx=Math.max(...a),r=(mx-mn)||1;
 const X=i=>P+i*(W-P-8)/(a.length-1),Y=v=>8+(H-16)*(1-(v-mn)/r);
 const pts=a.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)),lx=X(a.length-1).toFixed(1),ly=Y(a[a.length-1]).toFixed(1);
 const gl=[mx,mn].map(v=>`<line x1="${P}" x2="${W}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(255,255,255,.12)"/><text x="0" y="${(Y(v)+3).toFixed(1)}" font-size="9" fill="#94a3b8">${v}</text>`).join("");
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la force">${gl}<polygon points="${P},${H-8} ${pts.join(" ")} ${lx},${H-8}" fill="rgba(245,158,11,.18)"/><polyline points="${pts.join(" ")}" fill="none" stroke="#f59e0b" stroke-width="2"/><circle cx="${lx}" cy="${ly}" r="4.5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/></svg>`}
function prHtml(){
 const pr=S.me.pr||{},td=todayISO(),fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
 const bests=MOVES.map(m=>{const v=(pr[m[0]]||[]).map(e=>e.v);return v.length?Math.max(...v):null});
 const tiles=MOVES.map((m,i)=>`<div class="tile"><b>${bests[i]===null?"–":bests[i]+" kg"}</b><span>${m[1]}</span></div>`).join("");
 const total=bests.every(b=>b!==null)?`<p class="muted" style="margin:10px 0 0">Total des 4 records : <b class="title">${Math.round(bests.reduce((x,y)=>x+y,0)*10)/10} kg</b></p>`:"";
 const blocks=MOVES.map((m,i)=>{
  const k=m[0],a=pr[k]||[],vals=a.map(e=>e.v),best=bests[i];
  const prog=vals.length>1?`${best-vals[0]>=0?"+":""}${Math.round((best-vals[0])*10)/10} kg depuis ta 1re mesure`:vals.length?"Première mesure enregistrée":"Aucune mesure pour l’instant";
  let mx=-Infinity;const flags=vals.map(v=>{const up=v>mx&&mx>-Infinity;if(v>mx)mx=v;return up});
  const hist=a.map((e,j)=>({e,j,up:flags[j]})).slice(-3).reverse().map(x=>`<div class="mvl"><span>${fmt(x.e.d)} · <b style="color:var(--text)">${x.e.v} kg</b>${x.up?" 🏅":""}</span><button class="del" data-act="delpr" data-k="${k}" data-i="${x.j}" aria-label="Supprimer cette mesure">×</button></div>`).join("");
  return `<div class="mv"><div class="mvh"><div><b>${m[1]}</b>${m[2]?`<small>${m[2]}</small>`:""}</div><div class="mvbest">${best===null?"–":best+" <small>kg</small>"}</div></div>
<div class="muted" style="margin-top:4px">${prog}</div>${spark(vals)}
<div class="mvf"><input id="pr-v-${k}" type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" aria-label="Poids en kg"><input id="pr-d-${k}" type="date" value="${td}" max="${td}" aria-label="Date"><button class="btn" data-act="addpr" data-k="${k}">Ajouter</button></div>
<div class="err" id="pr-e-${k}"></div>${hist}</div>`}).join("");
 return `<p class="muted" style="margin-bottom:12px">Ton meilleur poids sur chaque mouvement clé, avec ton bras de combat (${S.me.arm==="D"?"droit":"gauche"}). Ajoute une mesure après chaque séance.</p><div class="pr4">${tiles}</div>${total}${blocks}`}
function tableHtml(){
 const fol=S.follows||[];
 const chips=S.opps.map(o=>{const f=fol.includes(o.id);return `<div class="chip">${avatar(o,"av3")}<b>${esc(o.name)}</b><button class="btn sm${f?" ghost":""}" data-act="follow" data-id="${o.id}">${f?"Abonné ✓":"Suivre"}</button></div>`}).join("");
 const posts=S.feed.filter(p=>p.who==="me"||fol.includes(p.who)).sort((x,y)=>y.t-x.t);
 return `<div class="card"><h2>Participants</h2><div class="chips">${chips}</div></div>${posts.length?posts.map(postHtml).join(""):'<div class="card"><p class="muted">Rien à afficher pour l’instant. Abonne-toi à des participants ou joue un duel : les actualités apparaîtront ici.</p></div>'}`}
function setVis(on,back){
 if(!on){delete S.me.cell;save();return render()}
 const fail=m=>{$("merr").textContent=m;if(back!==undefined){S.me.prec=back;$("prec").value=back}else $("vis").checked=false};
 if(!navigator.geolocation)return fail("La localisation n’est pas disponible sur cet appareil.");
 navigator.geolocation.getCurrentPosition(p=>{S.me.cell=snap(p.coords.latitude,p.coords.longitude,2*(S.me.prec||5));save();render()},
  ()=>fail("Localisation refusée ou indisponible. Autorise-la dans ton navigateur (la page doit être en HTTPS) pour apparaître sur la carte."),{maximumAge:600000,timeout:10000});
}
document.addEventListener("keydown",e=>{const f=$("sel");if(e.key==="Escape"&&f&&!f.hidden){selId=null;f.hidden=true;f.innerHTML=""}});
$("view").addEventListener("change",e=>{
 if(e.target.id==="vis")setVis(e.target.checked);
 if(e.target.id==="prec"){const back=S.me.prec||5;S.me.prec=+e.target.value;save();if(S.me.cell)setVis(true,back);else render()}
 if((e.target.id||"").startsWith("ph-post-")){const f=e.target.files[0],p=S.feed.find(x=>x.id===e.target.id.slice(8));if(!f||!p)return;readImg(f,640,u=>{if(!u)return;p.pic=u;save();render()});return}
 if(e.target.id==="ph-main"||e.target.id==="ph-add"){const f=e.target.files[0];if(!f)return;const main=e.target.id==="ph-main";
  readImg(f,main?480:240,u=>{if(!u)return;if(main)S.me.photo=u;else{S.me.gallery=S.me.gallery||[];if(S.me.gallery.length<4)S.me.gallery.push(u)}save();render()});return}
 if(e.target.id==="lvf"){lvFilter=e.target.value;selId=null;render()}
});
render();
</script>
</body>
</html>
