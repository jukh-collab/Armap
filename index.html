<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Armap</title>
<style>
:root{--bg:#050811;--card:rgba(15,23,42,.92);--accent:#f59e0b;--text:#f8fafc;--muted:#94a3b8;--border:rgba(255,255,255,.15);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text)}
#home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
h1{font-size:3.2rem;color:var(--accent);letter-spacing:5px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.sub{color:var(--muted);margin-top:6px}
.menu{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;margin-top:32px}
.menu button{display:flex;align-items:center;gap:14px;padding:18px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1.15rem;font-weight:700;cursor:pointer;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.menu button span{font-size:1.8rem}
.menu button small{display:block;color:var(--muted);font-weight:400;font-size:.8rem;margin-top:2px}
.menu button:hover,.menu button:focus-visible{border-color:var(--accent);outline:none}
#appview{display:none;height:100%;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--border)}
.bar button{padding:8px 14px;border-radius:6px;border:0;background:var(--accent);color:#000;font-weight:700;cursor:pointer}
#holder{flex:1;position:relative}
#holder iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<div id="home">
<h1>Armap</h1>
<p class="sub">Choisis ton épreuve</p>
<div class="menu">
<button id="b-grip"><span>✊</span><div>Grip Strength<small>Concours de force de préhension</small></div></button>
<button id="b-arm"><span>💪</span><div>Arm Wrestling<small>Duels de bras de fer, XP et niveaux</small></div></button>
</div>
</div>
<div id="appview">
<div class="bar"><button id="back">← Armap</button><b id="apptitle"></b></div>
<div id="holder"></div>
</div>
<script>
const APPS={grip:"<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>C2i Grip Challenge<\/title>\n  <style>\n    :root {\n      --bg-color: #050811;\n      --card-bg: rgba(15, 23, 42, 0.92);\n      --accent: #f59e0b;\n      --text: #f8fafc;\n      --text-muted: #94a3b8;\n      --border: rgba(255, 255, 255, 0.15);\n    }\n\n    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }\n\n    body {\n      background-color: var(--bg-color);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n      position: relative;\n    }\n\n    /* Image de fond animée (Affiche Stallone) */\n    .hero-bg {\n      position: fixed;\n      top: 0;\n      left: 0;\n      width: 100vw;\n      height: 100vh;\n      background-image: url('C2Igripstrength.png');\n      background-repeat: no-repeat;\n      z-index: 1;\n      animation: introPoster 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;\n      background-size: contain;\n      background-position: center center;\n    }\n\n    @keyframes introPoster {\n      0% {\n        width: 100vw;\n        left: 0;\n        opacity: 1;\n      }\n      100% {\n        width: 30vw;\n        left: 0;\n        opacity: 0.85;\n      }\n    }\n\n    @media (max-width: 1024px) {\n      @keyframes introPoster {\n        0% { width: 100vw; left: 0; opacity: 1; }\n        100% { width: 100vw; left: 0; opacity: 0.15; }\n      }\n    }\n\n    /* Overlay pour le GIF Predator */\n    #gif-overlay {\n      position: fixed;\n      top: 0;\n      left: 0;\n      width: 100vw;\n      height: 100vh;\n      background: rgba(5, 8, 17, 0.88);\n      z-index: 10002;\n      display: flex;\n      flex-direction: column;\n      justify-content: center;\n      align-items: center;\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 0.3s ease;\n      backdrop-filter: blur(8px);\n    }\n\n    #gif-overlay.active {\n      opacity: 1;\n      pointer-events: auto;\n    }\n\n    #gif-overlay .gif-box {\n      text-align: center;\n      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);\n    }\n\n    #gif-overlay img {\n      max-width: 480px;\n      width: 90vw;\n      border-radius: 12px;\n      box-shadow: 0 0 35px rgba(245, 158, 11, 0.5);\n      border: 3px solid var(--accent);\n    }\n\n    #gif-overlay h3 {\n      margin-top: 15px;\n      font-size: 2rem;\n      color: var(--accent);\n      text-shadow: 0 2px 10px rgba(0,0,0,0.9);\n      letter-spacing: 1px;\n    }\n\n    @keyframes popIn {\n      0% { transform: scale(0.6); opacity: 0; }\n      100% { transform: scale(1); opacity: 1; }\n    }\n\n    /* Conteneur principal */\n    .app-container {\n      position: relative;\n      z-index: 2;\n      width: 100%;\n      min-height: 100vh;\n      padding: 20px;\n      display: flex;\n      flex-direction: column;\n      animation: fadeInContent 1s ease-out 1.5s forwards;\n      opacity: 0;\n    }\n\n    @keyframes fadeInContent {\n      from { opacity: 0; transform: translateY(15px); }\n      to { opacity: 1; transform: translateY(0); }\n    }\n\n    header { \n      text-align: center; \n      margin-bottom: 20px; \n      background: rgba(5, 8, 17, 0.8);\n      padding: 16px 20px;\n      border-radius: 12px;\n      backdrop-filter: blur(8px);\n      border: 1px solid var(--border);\n    }\n    header h1 { \n      font-size: 2.4rem; \n      color: var(--accent); \n      text-shadow: 0 2px 8px rgba(0,0,0,0.9);\n      letter-spacing: 1px;\n    }\n\n    /* Layout */\n    .main-layout {\n      display: grid;\n      grid-template-columns: 1fr;\n      gap: 20px;\n      align-items: start;\n    }\n\n    @media (min-width: 1025px) {\n      .main-layout {\n        margin-left: 30vw;\n        grid-template-columns: 360px 1fr;\n      }\n    }\n\n    .left-column {\n      display: flex;\n      flex-direction: column;\n      gap: 20px;\n    }\n\n    .card { \n      background-color: var(--card-bg); \n      backdrop-filter: blur(12px); \n      border-radius: 12px; \n      padding: 20px; \n      border: 1px solid var(--border); \n      box-shadow: 0 8px 24px rgba(0,0,0,0.8); \n    }\n    .card h2 { font-size: 1.2rem; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }\n\n    .card-leaderboard {\n      min-height: calc(100vh - 140px);\n      display: flex;\n      flex-direction: column;\n    }\n\n    .form-row {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 10px;\n    }\n\n    .form-group { margin-bottom: 12px; }\n    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }\n    input, select { width: 100%; padding: 9px; border-radius: 6px; border: 1px solid var(--border); background-color: rgba(5, 8, 17, 0.9); color: var(--text); font-size: 0.95rem; }\n    input:focus, select:focus { outline: 2px solid var(--accent); }\n\n    .btn-submit { \n      width: 100%; \n      padding: 12px; \n      border: none; \n      border-radius: 6px; \n      background-color: var(--accent); \n      color: #000; \n      font-weight: bold; \n      font-size: 1rem; \n      cursor: pointer; \n      transition: opacity 0.2s; \n      margin-top: 5px; \n    }\n    .btn-submit:hover { opacity: 0.9; }\n\n    .reset-btn { \n      width: 100%; \n      background: #dc2626; \n      color: white; \n      border: none; \n      border-radius: 6px; \n      margin-top: 10px; \n      font-size: 0.8rem; \n      padding: 8px; \n      cursor: pointer; \n    }\n\n    .export-btn {\n      width: 100%;\n      background: transparent;\n      color: var(--text-muted);\n      border: 1px dashed var(--border);\n      padding: 6px 10px;\n      border-radius: 6px;\n      font-size: 0.75rem;\n      cursor: pointer;\n      margin-top: 8px;\n      transition: all 0.2s ease;\n    }\n    .export-btn:hover {\n      background: rgba(255, 255, 255, 0.05);\n      color: var(--text);\n      border-color: var(--text-muted);\n    }\n\n    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }\n    .filter-btn, .toggle-btn { \n      background: rgba(5, 8, 17, 0.8); \n      color: var(--text); \n      border: 1px solid var(--border); \n      padding: 5px 12px; \n      border-radius: 20px; \n      cursor: pointer; \n      font-size: 0.85rem; \n      transition: all 0.2s ease;\n    }\n    .filter-btn.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }\n    .toggle-btn:hover { border-color: var(--text-muted); background: rgba(255,255,255,0.05); }\n\n    .table-wrapper { overflow-x: auto; flex-grow: 1; }\n    table { width: 100%; border-collapse: collapse; text-align: left; }\n    th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }\n    th { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }\n    \n    .rank { font-weight: bold; width: 35px; text-align: center; }\n    .rank-1 { color: #ffd700; font-size: 1.2rem; }\n    .rank-2 { color: #c0c0c0; font-size: 1.1rem; }\n    .rank-3 { color: #cd7f32; font-size: 1.1rem; }\n    \n    .score-val { font-weight: bold; color: var(--accent); }\n    .ratio-val { font-weight: bold; color: #38bdf8; }\n    .weight-val { color: var(--text-muted); }\n    .badge { padding: 2px 6px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; display: inline-block; margin-right: 2px; }\n    .badge-H { background: #1e3a8a; color: #93c5fd; }\n    .badge-F { background: #831843; color: #fbcfe8; }\n    \n    .badge-hulk { background: #15803d; color: #bbf7d0; border: 1px solid #22c55e; }\n    .badge-bruce { background: #b45309; color: #fef08a; border: 1px solid #eab308; }\n    .badge-hook { background: #475569; color: #cbd5e1; border: 1px solid #94a3b8; }\n    .badge-tenace { background: #991b1b; color: #fecaca; border: 1px solid #ef4444; }\n    .badge-king { background: #7c2d12; color: #fef08a; border: 1px solid #f59e0b; margin-left: 6px; }\n\n    .btn-delete { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1rem; width: auto; padding: 0; }\n    \n    .col-hidden { display: none !important; }\n\n    /* Overlay d'invitation aléatoire (toutes les 30 min) */\n    #invite-overlay {\n      position: fixed;\n      top: 0;\n      left: 0;\n      width: 100vw;\n      height: 100vh;\n      background: rgba(5, 8, 17, 0.88);\n      z-index: 10000;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 0.3s ease;\n      backdrop-filter: blur(8px);\n    }\n    #invite-overlay.active { opacity: 1; pointer-events: auto; }\n    #invite-overlay .invite-box { text-align: center; padding: 20px; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }\n    #invite-overlay img {\n      max-width: 480px;\n      width: 90vw;\n      border-radius: 12px;\n      box-shadow: 0 0 35px rgba(245, 158, 11, 0.5);\n      border: 3px solid var(--accent);\n    }\n    #invite-overlay h3 {\n      margin-top: 15px;\n      font-size: 2.2rem;\n      color: var(--accent);\n      text-shadow: 0 2px 10px rgba(0,0,0,0.9);\n      letter-spacing: 1px;\n    }\n    #invite-overlay p { margin-top: 6px; font-size: 1.15rem; color: var(--text); }\n    #invite-close {\n      margin-top: 16px;\n      padding: 10px 24px;\n      border: none;\n      border-radius: 20px;\n      background: var(--accent);\n      color: #000;\n      font-weight: bold;\n      font-size: 1rem;\n      cursor: pointer;\n    }\n    #invite-close:hover { opacity: 0.9; }\n\n    /* Mode RPG */\n    .player-link { cursor: pointer; border-bottom: 1px dotted var(--text-muted); }\n    .player-link:hover { color: var(--accent); }\n    .rpg-cell { min-width: 110px; }\n    .rpg-lvl { font-size: 0.75rem; font-weight: bold; }\n    .rpg-lvl span { color: var(--text-muted); font-weight: normal; }\n    .bar { background: rgba(255, 255, 255, 0.12); border-radius: 6px; overflow: hidden; }\n    .bar.mini { height: 5px; margin-top: 3px; }\n    .bar.big { height: 14px; margin-top: 4px; }\n    .bar .fill { height: 100%; border-radius: 6px; transition: width 0.8s ease; }\n    .bar.xp .fill { background: #38bdf8; }\n    .bar.str .fill { background: #ef4444; }\n\n    #challenge-overlay {\n      position: fixed;\n      top: 0;\n      left: 0;\n      width: 100vw;\n      height: 100vh;\n      background: rgba(5, 8, 17, 0.88);\n      z-index: 10001;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      padding: 20px;\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 0.3s ease;\n      backdrop-filter: blur(8px);\n    }\n    #challenge-overlay.active { opacity: 1; pointer-events: auto; }\n    .challenge-box { width: 100%; max-width: 440px; text-align: center; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }\n    .challenge-box h2 { font-size: 1.6rem; color: var(--accent); }\n    .ch-level { font-weight: bold; margin-bottom: 14px; }\n    .ch-stat { margin-bottom: 12px; text-align: left; }\n    .ch-label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); }\n    .ch-hint { margin: 18px 0 10px; }\n    #ch-score { text-align: center; font-size: 1.4rem; margin-bottom: 8px; }\n    #ch-messages { margin: 18px 0 8px; display: flex; flex-direction: column; gap: 8px; font-size: 1.05rem; }\n    #ch-messages .big { font-size: 1.3rem; font-weight: bold; color: var(--accent); }\n    tr.player-row { cursor: pointer; }\n    tr.player-row:hover td { background: rgba(255, 255, 255, 0.05); }\n    .try-count { font-size: 0.75rem; color: var(--text-muted); margin-left: 4px; }\n    .challenge-box { max-height: 92vh; overflow-y: auto; }\n    .ch-chart-title { margin: 6px 0 2px; font-size: 0.85rem; color: var(--text-muted); text-align: left; }\n    .ch-legend { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }\n    #ch-undo { margin-top: 8px; }\n    .badge-duelliste { background: #581c87; color: #e9d5ff; border: 1px solid #a855f7; }\n    .badge-invaincu { background: #134e4a; color: #99f6e4; border: 1px solid #2dd4bf; }\n    .badge-rival { background: #9a3412; color: #fed7aa; border: 1px solid #fb923c; }\n    .ch-target { margin-top: 14px; color: var(--accent); font-weight: bold; font-size: 0.9rem; }\n    .quest { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; text-align: left; padding: 3px 0; color: var(--text-muted); }\n    .quest.done { color: var(--text); }\n    .quest em { font-style: normal; color: var(--text-muted); }\n    .quest .q-right { white-space: nowrap; }\n\n    #duel-overlay, #reset-overlay {\n      position: fixed;\n      top: 0;\n      left: 0;\n      width: 100vw;\n      height: 100vh;\n      background: rgba(5, 8, 17, 0.88);\n      z-index: 10001;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      padding: 20px;\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 0.3s ease;\n      backdrop-filter: blur(8px);\n    }\n    #duel-overlay.active, #reset-overlay.active { opacity: 1; pointer-events: auto; }\n    .duel-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; margin-top: 14px; text-align: left; }\n    .duel-vs { font-weight: bold; color: var(--accent); padding-bottom: 20px; }\n    .duel-row select, .duel-row input { margin-bottom: 8px; }\n    .duel-mode { margin-top: 6px; text-align: left; }\n    .duel-error { color: #f87171; min-height: 1.3em; font-size: 0.85rem; margin: 8px 0; }\n    #duel-messages { margin: 18px 0 8px; display: flex; flex-direction: column; gap: 8px; font-size: 1.05rem; }\n    #duel-messages .big { font-size: 1.3rem; font-weight: bold; color: var(--accent); }\n    /* Animation « level up » façon World of Warcraft (quête accomplie) */\n    #quest-overlay {\n      position: fixed;\n      top: 0;\n      left: 0;\n      width: 100vw;\n      height: 100vh;\n      z-index: 10003;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      overflow: hidden;\n      pointer-events: none;\n      opacity: 0;\n      background: radial-gradient(circle at center, rgba(255, 200, 60, 0.35), rgba(0, 0, 0, 0.8) 70%);\n    }\n    #quest-overlay.active { animation: questFade 3.6s ease forwards; }\n    @keyframes questFade { 0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }\n    .quest-rays {\n      position: absolute;\n      width: 150vmax;\n      height: 150vmax;\n      background: repeating-conic-gradient(rgba(255, 215, 0, 0.3) 0deg 6deg, transparent 6deg 18deg);\n      -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 55%);\n      mask-image: radial-gradient(circle, #000 0%, transparent 55%);\n      animation: raysSpin 12s linear infinite;\n    }\n    @keyframes raysSpin { to { transform: rotate(360deg); } }\n    .quest-box { position: relative; text-align: center; padding: 0 20px; animation: questPop 0.9s cubic-bezier(0.17, 0.89, 0.32, 1.28) both; }\n    @keyframes questPop { 0% { transform: scale(0.2); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }\n    .quest-rule {\n      height: 3px;\n      width: min(80vw, 620px);\n      margin: 12px auto;\n      background: linear-gradient(90deg, transparent, #ffd23f, transparent);\n      box-shadow: 0 0 14px rgba(255, 200, 60, 0.9);\n      animation: ruleGrow 1s ease both;\n    }\n    @keyframes ruleGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n    .quest-title {\n      font-family: Georgia, 'Times New Roman', serif;\n      font-size: clamp(2rem, 7vw, 4.5rem);\n      font-weight: 900;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n      background: linear-gradient(#fff6c2, #ffd23f 45%, #b8860b);\n      -webkit-background-clip: text;\n      background-clip: text;\n      color: transparent;\n      filter: drop-shadow(0 0 18px rgba(255, 200, 60, 0.9)) drop-shadow(0 4px 2px rgba(0, 0, 0, 0.8));\n    }\n    .quest-line {\n      font-family: Georgia, 'Times New Roman', serif;\n      font-size: clamp(1.1rem, 3.5vw, 2rem);\n      color: #ffe9a8;\n      text-shadow: 0 0 12px rgba(255, 190, 50, 0.8), 0 2px 3px #000;\n      margin-top: 8px;\n    }\n    .quest-line span { color: #fff; font-weight: bold; }\n    .quest-line.quest-extra { color: #fff; font-size: clamp(1rem, 3vw, 1.6rem); }\n    #quest-sparks { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }\n    .spark {\n      position: absolute;\n      left: 0;\n      top: 0;\n      width: 8px;\n      height: 8px;\n      border-radius: 50%;\n      background: #ffe27a;\n      box-shadow: 0 0 10px #ffc83c;\n      opacity: 0;\n      animation: sparkFly 1.6s ease-out forwards;\n    }\n    @keyframes sparkFly {\n      0% { transform: translate(0, 0) scale(1); opacity: 1; }\n      100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }\n    }\n    /* Légende des niveaux : fixe à gauche (grand écran), en bas de page sinon */\n    .level-legend { position: relative; z-index: 2; margin: 0 20px 20px; opacity: 0; animation: fadeInContent 1s ease-out 1.5s forwards; }\n    .level-legend h2 { cursor: pointer; user-select: none; display: flex; justify-content: space-between; font-size: 1rem; }\n    .level-legend.collapsed h2 { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }\n    .level-legend.collapsed .legend-body { display: none; }\n    .level-legend p { color: var(--text-muted); font-size: 0.8rem; margin: 6px 0 10px; }\n    .legend-levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; margin-bottom: 8px; }\n    .legend-level { display: flex; justify-content: space-between; gap: 8px; border: 1px solid var(--border nvite-close\">J'arrive ! 💪<\/button>\n    <\/div>\n  <\/div>\n\n  <div id=\"challenge-overlay\">\n    <div class=\"card challenge-box\">\n      <h2 id=\"ch-name\"><\/h2>\n      <div class=\"ch-level\" id=\"ch-level\"><\/div>\n      <div class=\"ch-stat\">\n        <div class=\"ch-label\"><span>⭐ Expérience<\/span><span id=\"ch-xp-text\"><\/span><\/div>\n        <div class=\"bar big xp\"><div class=\"fill\" id=\"ch-xp-fill\"><\/div><\/div>\n      <\/div>\n      <div class=\"ch-stat\">\n        <div class=\"ch-label\"><span>💪 Force<\/span><span id=\"ch-str-text\"><\/span><\/div>\n        <div class=\"bar big str\"><div class=\"fill\" id=\"ch-str-fill\"><\/div><\/div>\n      <\/div>\n      <div class=\"ch-legend\" id=\"ch-duels\"><\/div>\n      <div class=\"ch-chart-title\">📈 Historique des essais<\/div>\n      <div id=\"ch-chart\"><\/div>\n      <div class=\"ch-legend\">🟠 Record battu &nbsp;·&nbsp; 🔵 Essai<\/div>\n      <div id=\"ch-play\">\n        <div class=\"ch-target\" id=\"ch-target\"><\/div>\n        <p class=\"ch-hint\">Prêt à retenter ? Serre la machine, puis entre ton score :<\/p>\n        <input type=\"number\" id=\"ch-score\" step=\"0.1\" min=\"0\" max=\"200\" placeholder=\"Score en kg\">\n        <button type=\"button\" class=\"btn-submit\" id=\"ch-validate\">Valider le score<\/button>\n        <button type=\"button\" class=\"export-btn\" id=\"ch-cancel\">Annuler<\/button>\n        <div><button type=\"button\" class=\"export-btn\" id=\"ch-undo\">🗑️ Supprimer le dernier essai<\/button><\/div>\n      <\/div>\n      <div id=\"ch-result\" class=\"col-hidden\">\n        <div id=\"ch-messages\"><\/div>\n        <button type=\"button\" class=\"btn-submit\" id=\"ch-close\">Fermer<\/button>\n      <\/div>\n      <div class=\"ch-chart-title\" style=\"margin-top:14px\">🏅 Quêtes<\/div>\n      <div id=\"ch-quests\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"duel-overlay\">\n    <div class=\"card challenge-box\">\n      <h2>⚔️ Duel<\/h2>\n      <div id=\"duel-form\">\n        <div class=\"duel-row\">\n          <div>\n            <label for=\"duel-a\">Joueur 1<\/label>\n            <select id=\"duel-a\"><\/select>\n            <input type=\"number\" id=\"duel-sa\" step=\"0.1\" min=\"0\" max=\"200\" placeholder=\"Score (kg)\">\n          <\/div>\n          <div class=\"duel-vs\">VS<\/div>\n          <div>\n            <label for=\"duel-b\">Joueur 2<\/label>\n            <select id=\"duel-b\"><\/select>\n            <input type=\"number\" id=\"duel-sb\" step=\"0.1\" min=\"0\" max=\"200\" placeholder=\"Score (kg)\">\n          <\/div>\n        <\/div>\n        <div class=\"duel-mode\">\n          <label for=\"duel-mode\">Mode de comparaison<\/label>\n          <select id=\"duel-mode\">\n            <option value=\"score\">Score brut<\/option>\n            <option value=\"ratio\">Handicap (grip ÷ poids de corps)<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"duel-error\" id=\"duel-error\"><\/div>\n        <button type=\"button\" class=\"btn-submit\" id=\"duel-validate\">Valider le duel<\/button>\n        <button type=\"button\" class=\"export-btn\" id=\"duel-cancel\">Annuler<\/button>\n      <\/div>\n      <div id=\"duel-result\" class=\"col-hidden\">\n        <div id=\"duel-messages\"><\/div>\n        <button type=\"button\" class=\"btn-submit\" id=\"duel-close\">Fermer<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"reset-overlay\">\n    <div class=\"card challenge-box\">\n      <h2>🔒 Réinitialiser le concours<\/h2>\n      <p class=\"ch-hint\">Entre le mot de passe pour effacer tous les scores et les duels :<\/p>\n      <input type=\"password\" id=\"reset-password\" autocomplete=\"off\" placeholder=\"Mot de passe\">\n      <div class=\"duel-error\" id=\"reset-error\"><\/div>\n      <button type=\"button\" class=\"reset-btn\" id=\"reset-validate\">Effacer tout le concours<\/button>\n      <button type=\"button\" class=\"export-btn\" id=\"reset-cancel\">Annuler<\/button>\n    <\/div>\n  <\/ button type=\"submit\" class=\"btn-submit\">Ajouter au classement<\/button>\n          <\/form>\n          \n          <button class=\"reset-btn\" id=\"reset-btn\">Réinitialiser tout le concours<\/button>\n          <button class=\"export-btn\" id=\"export-csv-btn\">📥 Exporter la liste (CSV)<\/button>\n          <button class=\"export-btn\" id=\"invite-toggle-btn\">🔔 Invitations auto (30 min) : ON<\/button>\n          <button class=\"export-btn\" id=\"duel-btn\">⚔️ Lancer un duel<\/button>\n          <button class=\"export-btn\" id=\"invite-now-btn\">🎯 Inviter un joueur maintenant<\/button>\n          <button class=\"export-btn\" id=\"sound-btn\">🔊 Son : ON<\/button>\n          <button class=\"export-btn\" id=\"import-btn\">📂 Importer (CSV)<\/button>\n          <input type=\"file\" id=\"import-file\" accept=\".csv,text/csv\" style=\"display:none\">\n        <\/div>\n\n        <div class=\"card\">\n          <h2>Moyenne par Groupe 🏢<\/h2>\n          <div class=\"table-wrapper\">\n            <table>\n              <thead>\n                <tr>\n                  <th>Groupe<\/th>\n                  <th>Moy. Grip<\/th>\n                  <th>Part. (H/F)<\/th>\n                <\/tr>\n              <\/thead>\n              <tbody id=\"service-stats-body\">\n                <\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n\n      <\/div>\n\n      <div class=\"card card-leaderboard\">\n        <div class=\"controls\">\n          <h2>Classement<\/h2>\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">\n            <button class=\"toggle-btn\" id=\"toggle-weight-btn\">👁️ Masquer Poids<\/button>\n            <div>\n              <button class=\"filter-btn active\" data-filter=\"ALL\">Tous<\/button>\n              <button class=\"filter-btn\" data-filter=\"H\">Hommes<\/button>\n              <button class=\"filter-btn\" data-filter=\"F\">Femmes<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"table-wrapper\">\n          <table>\n            <thead>\n              <tr>\n                <th style=\"text-align: center;\">#<\/th>\n                <th>Nom<\/th>\n                <th>Groupe<\/th>\n                <th>Cat.<\/th>\n                <th>Grip<\/th>\n                <th>Ratio<\/th>\n                <th class=\"col-weight\">Poids de corps<\/th>\n                <th>Niveau<\/th>\n                <th>Badges<\/th>\n                <th><\/th>\n              <\/tr>\n            <\/thead>\n            <tbody id=\"leaderboard-body\">\n              <\/tbody>\n          <\/table>\n        <\/div>\n      <\/div>\n\n    <\/div>\n  <\/div>\n\n  <div class=\"card level-legend\" id=\"level-legend\"><\/div>\n\n  <script>\n    const INITIAL_PARTICIPANTS = [\n      { id: \"1\", name: \"Swen\", service: \"SCII\", category: \"H\", weight: 80, score: 52 },\n      { id: \"2\", name: \"Nathan\", service: \"SCII\", category: \"H\", weight: 70, score: 61 },\n      { id: \"3\", name: \"Paul\", service: \"SCII\", category: \"H\", weight: 61, score: 61.9 },\n      { id: \"4\", name: \"Clément\", service: \"DESA\", category: \"H\", weight: 57, score: 63.4 },\n      { id: \"5\", name: \"Corentin\", service: \"SCII\", category: \"H\", weight: 77, score: 64 },\n      { id: \"6\", name: \"Saadi\", service: \"SCII\", category: \"H\", weight: 85, score: 88 },\n      { id: \"7\", name: \"Nicolas\", service: \"ADIC\", category: \"H\", weight: 68, score: 62.7 },\n      { id: \"8\", name: \"Antho T\", service: \"SCII\", category: \"H\", weight: 76, score: 82.9 },\n      { id: \"9\", name: \"Tom\", service: \"ADIC\", category: \"H\", weight: 105, score: 71 },\n      { id: \"10\", name: \"Yvan\", service: \"ADIC\", category: \"H\", weight: 92, score: 88.9 },\n      { id: \"11\", name: \"Maxime\", service: \"ADIC\", category: \"H\", weight: 60, score: 49.6 },\n      { id: \"12\", name: \"Romain\", service: \"SSG\", category: \"H\", weight: 108, score: 83 },\n      { id: \"13\", name: \"Jessee\", service: \"ADIC\", category: \"H\", weight: 97, score: 108.6 },\n      { id: \"14\", name: \"Evariste\", service: \"ADIC\", category: \"H\", weight: 70, score: 64.9 },\n      { id: \"15\", name: \"Adrien F\", service: \"SCII\", category: \"H\", weight: 90, score: 87.4 },\n      { id: \"16\", name: \"Gilles\", service: \"SCII\", category: \"H\", weight: 61, score: 69.3 },\n      { id: \"17\", name: \"Julien\", service: \"SCII\", category: \"H\", weight: 82, score: 101.8 },\n      { id: \"18\", name: \"Camille\", service: \"SCII\", category: \"H\", weight: 71, score: 74.5 },\n      { id: \"19\", name: \"Milton\", service: \"VD N4\", category: \"H\", weight: 84, score: 60 },\n      { id: \"20\", name: \"Antho BAZZU\", service: \"ARC\", category: \"H\", weight: 90, score: 73.8 },\n      { id: \"21\", name: \"Franklin\", service: \"ADIC\", category: \"H\", weight: 71, score: 70.5 },\n      { id: \"22\", name: \"Patrick\", service: \"FLA3\", category: \"H\", weight: 89, score: 68 },\n      { id: \"23\", name: \"Yann\", service: \"SIMU\", category: \"H\", weight: 95, score: 56.9 },\n      { id: \"24\", name: \"Hilal\", service: \"ADIC\", category: \"H\", weight: 63, score: 54.1 },\n      { id: \"25\", name: \"Guillaume C.\", service: \"SCII\", category: \"H\", weight: 76, score: 89.3 },\n      { id: \"26\", name: \"François\", service: \"ADIC\", category: \"H\", weight: 68, score: 71.6 },\n      { id: \"27\", name: \"Silvio\", service: \"ADIC\", category: \"H\", weight: 90, score: 59 },\n      { id: \"28\", name: \"Hugo\", service: \"ADIC\", category: \"H\", weight: 75, score: 66.1 },\n      { id: \"29\", name: \"Louis\", service: \"ADIC\", category: \"H\", weight: 75, score: 62.4 },\n      { id: \"30\", name: \"Alberic\", service: \"ADIC\", category: \"H\", weight: 66, score: 66.1 },\n      { id: \"31\", name: \"Nico\", service: \"ASSYSTEM\", category: \"H\", weight: 62, score: 53 },\n      { id: \"32\", name: \"Pierre Aussenard\", service: \"SCII\", category: \"H\", weight: 100, score: 74 },\n      { id: \"33\", name: \"Dam1\", service: \"PFC\", category: \"H\", weight: null, score: 73 },\n      { id: \"34\", name: \"Michel D\", service: \"PFC\", category: \"H\", weight: null, score: 68 },\n      { id: \"35\", name: \"Michelle\", service: \"PFC\", category: \"F\", weight: 59, score: 38 },\n      { id: \"36\", name: \"quentin\", service: \"PFC\", category: \"H\", weight: 71, score: 71 },\n      { id: \"37\", name: \"Lucas N4\", service: \"PFC\", category: \"H\", weight: 66, score: 56.6 },\n      { id: \"38\", name: \"Hamza\", service: \"PFC\", category: \"H\", weight: 65, score: 52.7 },\n      { id: \"39\", name: \"Steph (Rambgro)\", service: \"PFC\", category: \"H\", weight: 100, score: 42.2 },\n      { id: \"40\", name: \"Benoit T\", service: \"PFC\", category: \"H\", weight: 80, score: 67 },\n      { id: \"41\", name: \"Aziz B\", service: \"PFC\", category: \"H\", weight: 80, score: 83 }\n    ];\n\n    let participants = JSON.parse(localStorage.getItem('grip_participants_v2')) || INITIAL_PARTICIPANTS;\n    let currentFilter = 'ALL';\n    let isWeightColumnVisible = true;\n\n    const form = document.getElementById('score-form');\n    const leaderboardBody = document.getElementById('leaderboard-body');\n    const serviceStatsBody = document.getElementById('service-stats-body');\n    const filterBtns = document.querySelectorAll('.filter-btn');\n    const resetBtn = document.getElementById('reset-btn');\n    const exportCsvBtn = document.getElementById('export-csv-btn');\n    const toggleWeightBtn = document.getElementById('toggle-weight-btn');\n    const gifOverlay = document.getElementById('gif-overlay');\n    const celebrationGif = document.getElementById('celebration-gif');\n\n    function saveData() {\n      localStorage.setItem('grip_participants_v2', JSON.stringify(participants));\n    }\n\n    // Un seul rang par joueur : on garde son meilleur essai\n    function getPlayers() {\n      const byKey = new Map();\n      participants.forEach(p => {\n        const key = playerKey(p.name);\n        const cur = byKey.get(key);\n        if (!cur) {\n          byKey.set(key, { ...p, key, tries: 1 });\n        } else {\n          const tries = cur.tries + 1;\n          if (p.score > cur.score) Object.assign(cur, p);\n          cur.tries = tries;\n        }\n      });\n      return Array.from(byKey.values());\n    }\n\n    function renderLeaderboard() {\n      leaderboardBody.innerHTML = '';\n      const players = getPlayers();\n      const duelInfo = computeDuelInfo();\n      const nameByKey = new Map(players.map(pl => [pl.key, pl.name]));\n      const attr = t => escapeHtml(t).replace(/\"/g, '&quot;');\n\n      let maxScore = -1;\n      let hulkId = null;\n\n      let minScore = Infinity;\n      let hookId = null;\n\n      let maxRatio = -1;\n      let bruceLeeId = null;\n\n      const maxTries = Math.max(0, ...players.map(p => p.tries));\n\n      players.forEach(p => {\n        const ratio = (p.weight && p.weight > 0) ? (p.score / p.weight) : 0;\n\n        if (p.score > maxScore) {\n          maxScore = p.score;\n          hulkId = p.key;\n        }\n\n        if (p.score < minScore) {\n          minScore = p.score;\n          hookId = p.key;\n        }\n\n        if (ratio > maxRatio && ratio > 0) {\n          maxRatio = ratio;\n          bruceLeeId = p.key;\n        }\n      });\n\n      let filtered = players.filter(p => currentFilter === 'ALL' || p.category === currentFilter);\n      filtered.sort((a, b) => b.score - a.score);\n\n      if (filtered.length === 0) {\n        leaderboardBody.innerHTML = `<tr><td colspan=\"10\" style=\"text-align:center; color: var(--text-muted); padding: 30px;\">Aucun participant pour le moment.<\/td><\/tr>`;\n      } else {\n        filtered.forEach((p, index) => {\n          const rank = index + 1;\n          let rankClass = '';\n          let rankSymbol = rank;\n\n          if (rank === 1) { rankClass = 'rank-1'; rankSymbol = '🥇'; }\n          else if (rank === 2) { rankClass = 'rank-2'; rankSymbol = '🥈'; }\n          else if (rank === 3) { rankClass = 'rank-3'; rankSymbol = '🥉'; }\n\n          const ratio = (p.weight && p.weight > 0) ? (p.score / p.weight).toFixed(2) : '-';\n\n          let badgeHtml = '';\n          if (p.key === hulkId && maxScore > 0) {\n            badgeHtml += `<span class=\"badge badge-hulk\" title=\"Plus gros score absolu\">🟢 Hulk<\/span>`;\n          }\n          if (p.key === bruceLeeId && maxRatio > 0) {\n            badgeHtml += `<span class=\"badge badge-bruce\" title=\"Meilleur ratio Poids/Puissance\">🟡 Bruce Lee<\/span>`;\n          }\n          if (p.key === hookId && players.length > 1) {\n            badgeHtml += `<span class=\"badge badge-hook\" title=\"Grip le plus faible\">🏴‍☠️ Capitaine Crochet<\/span>`;\n          }\n\n          if (maxTries > 1 && p.tries === maxTries) {\n            badgeHtml += `<span class=\"badge badge-tenace\" title=\"Le plus de participations (${p.tries})\">🤝 Tenace<\/span>`;\n          }\n\n          if (duelInfo.maxPlayed >= 2 && duelInfo.played.get(p.key) === duelInfo.maxPlayed) {\n            badgeHtml += `<span class=\"badge badge-duelliste\" title=\"Le plus de duels (${duelInfo.maxPlayed})\">⚔️ Duelliste<\/span>`;\n          }\n          if (duelInfo.maxStreak >= 2 && duelInfo.streak.get(p.key) === duelInfo.maxStreak) {\n            badgeHtml += `<span class=\"badge badge-invaincu\" title=\"Série de ${duelInfo.maxStreak} victoires en cours\">🛡️ Invaincu<\/span>`;\n          }\n          const rival = duelInfo.rivals.get(p.key);\n          if (rival) {\n            badgeHtml += `<span class=\"badge badge-rival\" title=\"Rivalité avec ${attr(nameByKey.get(rival.key) || '?')} (${rival.n} duels)\">😤 Rival<\/span>`;\n          }\n\n          const hiddenClass = isWeightColumnVisible ? '' : 'col-hidden';\n\n          const tr = document.createElement('tr');\n          tr.className = 'player-row';\n          tr.dataset.key = encodeURIComponent(p.key);\n          tr.innerHTML = `\n            <td class=\"rank ${rankClass}\">${rankSymbol}<\/td>\n            <td><strong title=\"Clique pour voir l'historique et lancer un essai\">${escapeHtml(p.name)}<\/strong>${p.tries > 1 ? `<span class=\"try-count\">×${p.tries}<\/span>` : ''}<\/td>\n            <td>${escapeHtml(p.service || '-')}<\/td>\n            <td><span class=\"badge badge-${p.category}\">${p.category === 'H' ? 'H' : 'F'}<\/span><\/td>\n            <td class=\"score-val\">${p.score.toFixed(1)} kg<\/td>\n            <td class=\"ratio-val\">${ratio !== '-' ? ratio + ' x' : '-'}<\/td>\n            <td class=\"weight-val col-weight ${hiddenClass}\">${p.weight ? p.weight.toFixed(1) + ' kg' : '-'}<\/td>\n            <td class=\"rpg-cell\">${rpgMiniHtml(getPlayerStats(p.key))}<\/td>\n            <td>${badgeHtml || '-'}<\/td>\n            <td><button class=\"btn-delete\" title=\"Supprimer ce joueur et ses essais\">✕<\/button><\/td>\n          `;\n          leaderboardBody.appendChild(tr);\n        });\n      }\n\n      const thWeight = document.querySelector('th.col-weight');\n      if (thWeight) {\n        if (isWeightColumnVisible) {\n          thWeight.classList.remove('col-hidden');\n        } else {\n          thWeight.classList.add('col-hidden');\n        }\n      }\n\n      renderServiceStats();\n    }\n\n    function renderServiceStats() {\n      serviceStatsBody.innerHTML = '';\n      if (participants.length === 0) {\n        serviceStatsBody.innerHTML = `<tr><td colspan=\"3\" style=\"text-align:center; color: var(--text-muted); padding: 15px;\">Pas encore de données.<\/td><\/tr>`;\n        return;\n      }\n\n      const services = {};\n\n      getPlayers().forEach(p => {\n        const sName = p.service ? p.service.trim().toUpperCase() : 'AUTRE';\n        if (!services[sName]) {\n          services[sName] = { totalScore: 0, count: 0, hommes: 0, femmes: 0 };\n        }\n        services[sName].totalScore += p.score;\n        services[sName].count += 1;\n        if (p.category === 'H') services[sName].hommes += 1;\n        if (p.category === 'F') services[sName].femmes += 1;\n      });\n\n      const statsArray = Object.keys(services).map(name => ({\n        name,\n        avg: services[name].totalScore / services[name].count,\n        count: services[name].count,\n        h: services[name].hommes,\n        f: services[name].femmes\n      }));\n\n      statsArray.sort((a, b) => b.avg - a.avg);\n\n      const bestServiceAvg = statsArray.length > 0 ? statsArray[0].avg : 0;\n\n      statsArray.forEach((s, idx) => {\n        const tr = document.createElement('tr');\n        \n        let kingBadge = (idx === 0 && bestServiceAvg > 0) ? `<span class=\"badge badge-king\" title=\"Meilleur groupe en moyenne\">👑 King<\/span>` : '';\n\n        tr.innerHTML = `\n          <td><strong>${escapeHtml(s.name)}<\/strong>${kingBadge}<\/td>\n          <td class=\"score-val\">${s.avg.toFixed(1)} kg<\/td>\n          <td>${s.count} <span style=\"color:var(--text-muted); font-size:0.8rem;\">(${s.h}H / ${s.f}F)<\/span><\/td>\n        `;\n        serviceStatsBody.appendChild(tr);\n      });\n    }\n\n    function escapeHtml(text) {\n      const div = document.createElement('div');\n      div.innerText = text;\n      return div.innerHTML;\n    }\n\n    function triggerGifAnimation() {\n      const originalSrc = celebrationGif.src;\n      celebrationGif.src = '';\n      celebrationGif.src = originalSrc;\n\n      gifOverlay.classList.add('active');\n      \n      setTimeout(() => {\n        gifOverlay.classList.remove('active');\n      }, 2800);\n    }\n\n    toggleWeightBtn.addEventListener('click', () => {\n      isWeightColumnVisible = !isWeightColumnVisible;\n      toggleWeightBtn.textContent = isWeightColumnVisible ? '👁️ Masquer Poids' : '👁️ Afficher Poids';\n      renderLeaderboard();\n    });\n\n    form.addEventListener('submit', (e) => {\n      e.preventDefault();\n      const name = document.getElementById('name').value.trim();\n      const service = document.getElementById('service').value.trim();\n      const category = document.getElementById('category').value;\n      const weightVal = document.getElementById('weight').value;\n      const weight = weightVal !== '' ? parseFloat(weightVal) : null;\n      const score = parseFloat(document.getElementById('score').value);\n\n      if (name && !isNaN(score)) {\n        const key = playerKey(name);\n        const before = getPlayerStats(key);\n        participants.push({ \n          id: Date.now().toString(), \n          name, \n          service,\n          category, \n          weight,\n          score \n        });\n        saveData();\n        renderLeaderboard();\n        form.reset();\n        document.getElementById('name').focus();\n\n        celebrate([{ name, before, after: getPlayerStats(key) }]);\n      }\n    });\n\n    filterBtns.forEach(btn => {\n      btn.addEventListener('click', () => {\n        filterBtns.forEach(b => b.classList.remove('active'));\n        btn.classList.add('active');\n        currentFilter = btn.dataset.filter;\n        renderLeaderboard();\n      });\n    });\n\n    // ===== Réinitialisation protégée par mot de passe =====\n    // Seule l'empreinte du mot de passe est stockée ici, pas le mot de passe lui-même.\n    // Pour en changer : taper cyrb53('nouveau mot de passe') dans la console du navigateur\n    // et remplacer la valeur de RESET_PASSWORD_HASH.\n    const RESET_PASSWORD_HASH = 7700918077650239;\n\n    function cyrb53(str, seed = 0) {\n      let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;\n      for (let i = 0, ch; i < str.length; i++) {\n        ch = str.charCodeAt(i);\n        h1 = Math.imul(h1 ^ ch, 2654435761);\n        h2 = Math.imul(h2 ^ ch, 1597334677);\n      }\n      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);\n      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);\n      return 4294967296 * (2097151 & h2) + (h1 >>> 0);\n    }\n\n    const resetOverlay = document.getElementById('reset-overlay');\n    const resetPassword = document.getElementById('reset-password');\n    const resetError = document.getElementById('reset-error');\n\n    function closeResetModal() {\n      resetOverlay.classList.remove('active');\n      resetPassword.value = '';\n      resetError.textContent = '';\n    }\n\n    function validateReset() {\n      if (cyrb53(resetPassword.value) !== RESET_PASSWORD_HASH) {\n        resetError.textContent = 'Mot de passe incorrect.';\n        resetPassword.value = '';\n        resetPassword.focus();\n        return;\n      }\n      closeResetModal();\n      if (confirm('Attention : cela va effacer TOUS les scores et les duels du concours. Continuer ?')) {\n        participants = [];\n        duels = [];\n        saveData();\n        saveDuels();\n        renderLeaderboard();\n      }\n    }\n\n    resetBtn.addEventListener('click', () => {\n      resetPassword.value = '';\n      resetError.textContent = '';\n      resetOverlay.classList.add('active');\n      setTimeout(() => resetPassword.focus(), 150);\n    });\n    document.getElementById('reset-validate').addEventListener('click', validateReset);\n    document.getElementById('reset-cancel').addEventListener('click', closeResetModal);\n    resetPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') validateReset(); });\n    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && resetOverlay.classList.contains('active')) closeResetModal(); });\n\n    exportCsvBtn.addEventListener('click', () => {\n      if (participants.length === 0) {\n        alert('Aucune donnée à exporter.');\n        return;\n      }\n\n      let csvContent = \"data:text/csv;charset=utf-8,Nom,Groupe,Categorie,Poids de corps (kg),Grip (kg),Ratio (Grip/Poids)\\n\";\n\n      participants.forEach(p => {\n        const ratio = (p.weight && p.weight > 0) ? (p.score / p.weight).toFixed(2) : '-';\n        csvContent += `\"${p.name}\",\"${p.service || ''}\",\"${p.category}\",${p.weight || ''},${p.score},${ratio}\\n`;\n      });\n\n      const encodedUri = encodeURI(csvContent);\n      const link = document.createElement(\"a\");\n      link.setAttribute(\"href\", encodedUri);\n      link.setAttribute(\"download\", `C2i_Grip_Challenge_${new Date().toISOString().slice(0,10)}.csv`);\n      document.body.appendChild(link);\n      link.click();\n      document.body.removeChild(link);\n    });\n\n    // ===== Mode RPG : expérience, force et niveaux =====\n    // Tout est calculé à partir de la liste des essais : 1 essai = 1 XP,\n    // et chaque essai qui bat le record personnel donne 1 point de force.\n    const XP_PER_LEVEL = 3;     // XP nécessaires pour monter d'un niveau\n    const STRENGTH_MAX = 10;    // points de force pour remplir la jauge\n    const LEVEL_TITLES = ['Recrue', 'Apprenti', 'Costaud', 'Gladiateur', 'Berserker', 'Titan', 'Légende'];\n\n    const levelTitle = lvl => LEVEL_TITLES[Math.min(lvl - 1, LEVEL_TITLES.length - 1)];\n    const playerKey = name => name.trim().toLowerCase();\n    const xpPct = st => (st.xpInLevel / XP_PER_LEVEL) * 100;\n    const strPct = st => (Math.min(st.records, STRENGTH_MAX) / STRENGTH_MAX) * 100;\n\n    const JUMP_KG = 2;      // quête « Surpassement » : record battu d'au moins 2 kg\n    const RIVAL_MIN = 3;    // nombre de duels entre deux joueurs pour une rivalité\n\n    // Duels enregistrés (stockés dans le navigateur)\n    let duels = (() => {\n      try { const d = JSON.parse(localStorage.getItem('grip_duels_v1')); return Array.isArray(d) ? d : []; }\n      catch (e) { return []; }\n    })();\n    function saveDuels() { localStorage.setItem('grip_duels_v1', JSON.stringify(duels)); }\n\n    // Quêtes : chacune donne de l'XP bonus une fois accomplie\n    const QUESTS = [\n      { id: 'try3',  icon: '🔥', title: 'Échauffement', desc: 'Faire 3 essais', xp: 1, goal: 3, value: s => s.tries },\n      { id: 'try6',  icon: '🏃', title: 'Marathonien', desc: 'Faire 6 essais', xp: 2, goal: 6, value: s => s.tries },\n      { id: 'jump',  icon: '🚀', title: 'Surpassement', desc: `Battre son record de +${JUMP_KG} kg`, xp: 1, goal: 1, value: s => s.jumped ? 1 : 0 },\n      { id: 'rec3',  icon: '💪', title: 'Machine', desc: 'Battre 3 fois son record', xp: 2, goal: 3, value: s => s.records },\n      { id: 'duel1', icon: '⚔️', title: 'Premier duel', desc: 'Gagner un duel', xp: 1, goal: 1, value: s => s.duelWins },\n      { id: 'duel3', icon: '🛡️', title: 'Sans pitié', desc: 'Gagner 3 duels', xp: 2, goal: 3, value: s => s.duelWins }\n    ];\n\n    function getPlayerStats(key) {\n      const attempts = participants.filter(p => playerKey(p.name) === key); // ordre chronologique\n      let best = 0, records = 0, jumped = false;\n      attempts.forEach((p, i) => {\n        if (i > 0 && p.score > best) records++;\n        if (i > 0 && p.score >= best + JUMP_KG) jumped = true;\n        if (p.score > best) best = p.score;\n      });\n      let duelWins = 0, duelLosses = 0, duelDraws = 0;\n      duels.forEach(d => {\n        if (d.a !== key && d.b !== key) return;\n        if (!d.winner) duelDraws++;\n        else if (d.winner === key) duelWins++;\n        else duelLosses++;\n      });\n      const last = attempts[attempts.length - 1];\n      const base = {\n        key, last, best, records, jumped, duelWins, duelLosses, duelDraws,\n        tries: attempts.length,\n        scores: attempts.map(p => p.score),\n        name: last ? last.name.trim() : key\n      };\n      base.quests = QUESTS.map(q => {\n        const progress = Math.min(q.value(base), q.goal);\n        return { ...q, progress, done: progress >= q.goal };\n      });\n      const questXp = base.quests.filter(q => q.done).reduce((sum, q) => sum + q.xp, 0);\n      const xp = base.tries + duelWins + questXp;\n      return { ...base, xp, questXp, level: Math.floor(xp / XP_PER_LEVEL) + 1, xpInLevel: xp % XP_PER_LEVEL };\n    }\n\n    // Infos sur les duels pour les badges (Duelliste, Invaincu, Rival)\n    function computeDuelInfo() {\n      const played = new Map(), streak = new Map(), pairs = new Map();\n      duels.forEach(d => {\n        [d.a, d.b].forEach(k => {\n          played.set(k, (played.get(k) || 0) + 1);\n          streak.set(k, d.winner === k ? (streak.get(k) || 0) + 1 : 0);\n        });\n        const pk = JSON.stringify([d.a, d.b].sort());\n        const cur = pairs.get(pk) || { a: d.a, b: d.b, n: 0 };\n        cur.n++;\n        pairs.set(pk, cur);\n      });\n      const rivals = new Map();\n      pairs.forEach(pr => {\n        if (pr.n < RIVAL_MIN) return;\n        [[pr.a, pr.b], [pr.b, pr.a]].forEach(([k, other]) => {\n          const cur = rivals.get(k);\n          if (!cur || pr.n > cur.n) rivals.set(k, { key: other, n: pr.n });\n        });\n      });\n      return {\n        played, streak, rivals,\n        maxPlayed: Math.max(0, ...played.values()),\n        maxStreak: Math.max(0, ...streak.values())\n      };\n    }\n\n    function questLines(before, after, label = '') {\n      return after.quests\n        .filter(q => q.done && !before.quests.find(b => b.id === q.id).done)\n        .map(q => `<div>🏅 ${label}Quête accomplie : <strong>${q.icon} ${q.title}<\/strong> (+${q.xp} XP)<\/div>`)\n        .join('');\n    }\n\n    function rpgMiniHtml(st) {\n      return `<div title=\"XP ${st.xpInLevel}/${XP_PER_LEVEL} · Force ${st.records}\">\n        <div class=\"rpg-lvl\">Niv. ${st.level} <span>${levelTitle(st.level)}<\/span><\/div>\n        <div class=\"bar mini xp\"><div class=\"fill\" style=\"width:${xpPct(st)}%\"><\/div><\/div>\n        <div class=\"bar mini str\"><div class=\"fill\" style=\"width:${strPct(st)}%\"><\/div><\/div>\n      <\/div>`;\n    }\n\n    const challengeOverlay = document.getElementById('challenge-overlay');\n    const chName = document.getElementById('ch-name');\n    const chLevel = document.getElementById('ch-level');\n    const chXpFill = document.getElementById('ch-xp-fill');\n    const chXpText = document.getElementById('ch-xp-text');\n    const chStrFill = document.getElementById('ch-str-fill');\n    const chStrText = document.getElementById('ch-str-text');\n    const chPlay = document.getElementById('ch-play');\n    const chResult = document.getElementById('ch-result');\n    const chMessages = document.getElementById('ch-messages');\n    const chScore = document.getElementById('ch-score');\n    let currentPlayerKey = null;\n\n    const chChart = document.getElementById('ch-chart');\n    const chDuels = document.getElementById('ch-duels');\n    const chTarget = document.getElementById('ch-target');\n    const chQuests = document.getElementById('ch-quests');\n\n    // Courbe SVG : X = numéro de l'essai, Y = score (kg)\n    function chartSvg(scores) {\n      const W = 400, H = 175, L = 38, R = 14, T = 18, B = 32;\n      const n = scores.length;\n      let lo = Math.min(...scores), hi = Math.max(...scores);\n      if (hi - lo < 1) { lo -= 5; hi += 5; }\n      else { const pad = (hi - lo) * 0.15; lo -= pad; hi += pad; }\n      lo = Math.max(0, lo);\n      const x = i => n === 1 ? L + (W - L - R) / 2 : L + (i * (W - L - R)) / (n - 1);\n      const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));\n\n      let best = -Infinity;\n      const isRecord = scores.map((v, i) => { const r = i > 0 && v > best; best = Math.max(best, v); return r; });\n\n      let svg = `<svg viewBox=\"0 0 ${W} ${H}\" style=\"width:100%;height:auto;display:block\" role=\"img\" aria-label=\"Historique des essais\">`;\n      for (let k = 0; k <= 3; k++) {\n        const v = lo + ((hi - lo) * k) / 3;\n        svg += `<line x1=\"${L}\" y1=\"${y(v)}\" x2=\"${W - R}\" y2=\"${y(v)}\" stroke=\"rgba(255,255,255,0.1)\"/>`;\n        svg += `<text x=\"${L - 6}\" y=\"${y(v) + 3}\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--text-muted)\">${Math.round(v)}<\/text>`;\n      }\n      svg += `<text x=\"4\" y=\"10\" font-size=\"10\" fill=\"var(--text-muted)\">kg<\/text>`;\n      svg += `<text x=\"${(L + W - R) / 2}\" y=\"${H - 2}\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text-muted)\">Essai n°<\/text>`;\n\n      const step = Math.ceil(n / 10);\n      scores.forEach((v, i) => {\n        if (i % step === 0 || i === n - 1) {\n          svg += `<text x=\"${x(i)}\" y=\"${H - B + 14}\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text-muted)\">${i + 1}<\/text>`;\n        }\n      });\n\n      svg += `<polyline fill=\"none\" stroke=\"#38bdf8\" stroke-width=\"2\" points=\"${scores.map((v, i) => `${x(i)},${y(v)}`).join(' ')}\"/>`;\n      scores.forEach((v, i) => {\n        svg += `<circle cx=\"${x(i)}\" cy=\"${y(v)}\" r=\"4.5\" fill=\"${isRecord[i] ? '#f59e0b' : '#38bdf8'}\"/>`;\n        if (n <= 8 || i === n - 1) {\n          svg += `<text x=\"${x(i)}\" y=\"${y(v) - 9}\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">${v.toFixed(1)}<\/text>`;\n        }\n      });\n      return svg + '<\/svg>';\n    }\n\n    function paintExtras(st) {\n      chChart.innerHTML = chartSvg(st.scores);\n      const nbDuels = st.duelWins + st.duelLosses + st.duelDraws;\n      chDuels.textContent = nbDuels > 0 ? `⚔️ Duels : ${st.duelWins} V · ${st.duelLosses} D · ${st.duelDraws} N` : '';\n      chTarget.textContent = `🎯 Défi : atteins ${(st.best + JUMP_KG).toFixed(1)} kg ou plus (record +${JUMP_KG} kg)`;\n      chQuests.innerHTML = st.quests.map(q => `<div class=\"quest ${q.done ? 'done' : ''}\">\n          <span>${q.done ? '✅' : '⬜'} ${q.icon} <strong>${q.title}<\/strong> <em>${q.desc}<\/em><\/span>\n          <span class=\"q-right\">${q.done ? `+${q.xp} XP` : `${q.progress}/${q.goal}`}<\/span>\n        <\/div>`).join('');\n    }\n\n    function paintChallenge(st) {\n      paintExtras(st);\n      chLevel.textContent = `Niveau ${st.level} · ${levelTitle(st.level)}`;\n      chXpFill.style.width = xpPct(st) + '%';\n      chXpText.textContent = `${st.xpInLevel}/${XP_PER_LEVEL}`;\n      chStrFill.style.width = strPct(st) + '%';\n      chStrText.textContent = st.records >= STRENGTH_MAX ? `${st.records} (MAX)` : `${st.records}/${STRENGTH_MAX}`;\n    }\n\n    function openChallenge(key) {\n      const st = getPlayerStats(key);\n      if (!st.last) return;\n      currentPlayerKey = key;\n      chName.textContent = st.name;\n      paintChallenge(st);\n      chScore.value = '';\n      chPlay.classList.remove('col-hidden');\n      chResult.classList.add('col-hidden');\n      challengeOverlay.classList.add('active');\n      setTimeout(() => chScore.focus(), 150);\n    }\n\n    function closeChallenge() {\n      challengeOverlay.classList.remove('active');\n      currentPlayerKey = null;\n    }\n\n    function validateChallenge() {\n      const score = parseFloat(chScore.value);\n      if (isNaN(score) || score < 0 || score > 200) { chScore.focus(); return; }\n\n      const before = getPlayerStats(currentPlayerKey);\n      const ref = before.last;\n      participants.push({\n        id: Date.now().toString(),\n        name: ref.name,\n        service: ref.service,\n        category: ref.category,\n        weight: ref.weight,\n        score\n      });\n      saveData();\n      renderLeaderboard();\n\n      const after = getPlayerStats(currentPlayerKey);\n      const isRecord = score > before.best;\n      const levelUp = after.level > before.level;\n\n      // Animation des jauges\n      if (levelUp) {\n        paintExtras(after);\n        chXpFill.style.width = '100%';\n        chXpText.textContent = `${XP_PER_LEVEL}/${XP_PER_LEVEL}`;\n        setTimeout(() => {\n          chXpFill.style.transition = 'none';\n          chXpFill.style.width = '0%';\n          void chXpFill.offsetWidth;\n          chXpFill.style.transition = '';\n          paintChallenge(after);\n        }, 900);\n        chStrFill.style.width = strPct(after) + '%';\n        chStrText.textContent = after.records >= STRENGTH_MAX ? `${after.records} (MAX)` : `${after.records}/${STRENGTH_MAX}`;\n      } else {\n        paintChallenge(after);\n      }\n\n      // Messages de résultat\n      let html = `<div>Score enregistré : <strong>${score.toFixed(1)} kg<\/strong><\/div><div>⭐ +1 point d'expérience<\/div>`;\n      if (isRecord) {\n        html += `<div class=\"big\">🔥 Nouveau record ! +1 point de force 💪<\/div><div style=\"color:var(--text-muted)\">Ancien record : ${before.best.toFixed(1)} kg<\/div>`;\n      } else {\n        html += `<div style=\"color:var(--text-muted)\">Pas de record cette fois (record : ${before.best.toFixed(1)} kg). Retente ta chance !<\/div>`;\n      }\n      if (levelUp) {\n        html += `<div class=\"big\">🎉 Niveau ${after.level} atteint : ${levelTitle(after.level)} !<\/div>`;\n      }\n      html += questLines(before, after);\n      chMessages.innerHTML = html;\n      chPlay.classList.add('col-hidden');\n      chResult.classList.remove('col-hidden');\n\n      celebrate([{ name: after.name, before, after }]);\n    }\n\n    function deletePlayer(key) {\n      const st = getPlayerStats(key);\n      if (!st.last) return;\n      if (confirm(`Supprimer ${st.name} et ses ${st.tries} essai(s) ?`)) {\n        participants = participants.filter(p => playerKey(p.name) !== key);\n        duels = duels.filter(d => d.a !== key && d.b !== key);\n        saveData();\n        saveDuels();\n        renderLeaderboard();\n      }\n    }\n\n    function undoLastAttempt() {\n      const st = getPlayerStats(currentPlayerKey);\n      if (!st.last) return;\n      const msg = st.tries > 1\n        ? `Supprimer le dernier essai de ${st.name} (${st.last.score.toFixed(1)} kg) ?`\n        : `C'est le seul essai de ${st.name} : le joueur sera retiré du classement. Continuer ?`;\n      const inDuel = duels.some(d => d.ida === st.last.id || d.idb === st.last.id);\n      if (!confirm(msg + (inDuel ? ' Ce duel sera aussi annulé.' : ''))) return;\n      participants = participants.filter(p => p.id !== st.last.id);\n      duels = duels.filter(d => d.ida !== st.last.id && d.idb !== st.last.id);\n      saveData();\n      saveDuels();\n      renderLeaderboard();\n      if (st.tries > 1) paintChallenge(getPlayerStats(currentPlayerKey));\n      else closeChallenge();\n    }\n\n    leaderboardBody.addEventListener('click', (e) => {\n      const row = e.target.closest('tr[data-key]');\n      if (!row) return;\n      const key = decodeURIComponent(row.dataset.key);\n      if (e.target.closest('.btn-delete')) deletePlayer(key);\n      else openChallenge(key);\n    });\n    document.getElementById('ch-undo').addEventListener('click', undoLastAttempt);\n    document.getElementById('ch-validate').addEventListener('click', validateChallenge);\n    document.getElementById('ch-cancel').addEventListener('click', closeChallenge);\n    document.getElementById('ch-close').addEventListener('click', closeChallenge);\n    chScore.addEventListener('keydown', (e) => { if (e.key === 'Enter') validateChallenge(); });\n    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && challengeOverlay.classList.contains('active')) closeChallenge(); });\n\n    // ===== Animation « level up » (quête accomplie) =====\n    const questOverlay = document.getElementById('quest-overlay');\n    const questTitleEl = document.getElementById('quest-title');\n    const questLinesEl = document.getElementById('quest-lines');\n    const questSparks = document.getElementById('quest-sparks');\n    let questTimer = null;\n\n    function newlyDoneQuests(before, after) {\n      return after.quests.filter(q => q.done && !before.quests.find(b => b.id === q.id).done);\n    }\n\n    function showQuestAnimation(lines, extras) {\n      questTitleEl.textContent = lines.length > 1 ? 'Quêtes accomplies !' : 'Quête accomplie !';\n      questLinesEl.innerHTML = '';\n      lines.forEach(l => {\n        const div = document.createElement('div');\n        div.className = 'quest-line';\n        div.textContent = l.text + ' ';\n        const xp = document.createElement('span');\n        xp.textContent = `+${l.xp} XP`;\n        div.appendChild(xp);\n        questLinesEl.appendChild(div);\n      });\n      extras.forEach(t => {\n        const div = document.createElement('div');\n        div.className = 'quest-line quest-extra';\n        div.textContent = t;\n        questLinesEl.appendChild(div);\n      });\n      questSparks.innerHTML = '';\n      for (let i = 0; i < 24; i++) {\n        const sp = document.createElement('i');\n        sp.className = 'spark';\n        const angle = Math.random() * 2 * Math.PI;\n        const dist = 120 + Math.random() * 260;\n        sp.style.setProperty('--dx', Math.cos(angle) * dist + 'px');\n        sp.style.setProperty('--dy', Math.sin(angle) * dist + 'px');\n        sp.style.animationDelay = (Math.random() * 0.4) + 's';\n        questSparks.appendChild(sp);\n      }\n      questOverlay.classList.remove('active');\n      void questOverlay.offsetWidth;\n      questOverlay.classList.add('active');\n      clearTimeout(questTimer);\n      questTimer = setTimeout(() => questOverlay.classList.remove('active'), 3800);\n    }\n\n    // Quête accomplie → animation dorée ; sinon → gif habituel\n    function celebrate(results) {\n      const lines = [], extras = [];\n      const multi = results.length > 1;\n      results.forEach(({ name, before, after }) => {\n        newlyDoneQuests(before, after).forEach(q => lines.push({ text: `${multi ? name + ' · ' : ''}${q.icon} ${q.title}`, xp: q.xp }));\n        if (after.level > before.level) extras.push(`${multi ? name + ' : ' : ''}Niveau ${after.level} atteint !`);\n      });\n      if (lines.length || extras.length) playDing();\n      if (lines.length) showQuestAnimation(lines, extras);\n      else triggerGifAnimation();\n    }\n\n    // ===== Son « ding » de montée de niveau =====\n    let soundOn = true;\n    let audioCtx = null;\n\n    function playDing() {\n      if (!soundOn) return;\n      try {\n        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();\n        if (audioCtx.state === 'suspended') audioCtx.resume();\n        const t0 = audioCtx.currentTime + 0.02;\n        // Arpège de sol majeur, la dernière note résonne plus longtemps\n        [[784, 0], [988, 0.13], [1175, 0.26], [1568, 0.42]].forEach(([freq, delay], i) => {\n          const end = t0 + delay + (i === 3 ? 1.6 : 0.5);\n          [['sine', freq, 0.3], ['triangle', freq * 2, 0.06]].forEach(([type, f, vol]) => {\n            const osc = audioCtx.createOscillator();\n            const gain = audioCtx.createGain();\n            osc.type = type;\n            osc.frequency.value = f;\n            gain.gain.setValueAtTime(0.0001, t0 + delay);\n            gain.gain.exponentialRampToValueAtTime(vol, t0 + delay + 0.02);\n            gain.gain.exponentialRampToValueAtTime(0.0001, end);\n            osc.connect(gain);\n            gain.connect(audioCtx.destination);\n            osc.start(t0 + delay);\n            osc.stop(end + 0.05);\n          });\n        });\n      } catch (e) { /* pas de son disponible : on ignore */ }\n    }\n\n    const soundBtn = document.getElementById('sound-btn');\n    soundBtn.addEventListener('click', () => {\n      soundOn = !soundOn;\n      soundBtn.textContent = `🔊 Son : ${soundOn ? 'ON' : 'OFF'}`;\n      if (soundOn) playDing(); // petit test à l'activation\n    });\n\n    // ===== Légende des niveaux =====\n    function renderLevelLegend() {\n      const box = document.getElementById('level-legend');\n      const lastIdx = LEVEL_TITLES.length - 1;\n      const items = LEVEL_TITLES.map((title, i) => `<div class=\"legend-level\"><span><b>Niv. ${i + 1}${i === lastIdx ? '+' : ''}<\/b> ${title}<\/span><span class=\"legend-xp\">dès ${i * XP_PER_LEVEL} XP<\/span><\/div>`).join('');\n      box.innerHTML = `\n        <h2><span>📜 Légende des niveaux<\/span><span id=\"legend-arrow\">▾<\/span><\/h2>\n        <div class=\"legend-body\">\n          <p>⭐ 1 XP par essai, +1 XP au vainqueur d'un duel, plus l'XP des quêtes. ${XP_PER_LEVEL} XP = 1 niveau.<\/p>\n          <div class=\"legend-levels\">${items}<\/div>\n          <p>💪 +1 point de force par record battu (jauge pleine à ${STRENGTH_MAX}).<\/p>\n        <\/div>`;\n      box.querySelector('h2').addEventListener('click', () => {\n        const collapsed = box.classList.toggle('collapsed');\n        document.getElementById('legend-arrow').textContent = collapsed ? '▸' : '▾';\n      });\n    }\n\n    // ===== Mode duel =====\n    const duelOverlay = document.getElementById('duel-overlay');\n    const duelA = document.getElementById('duel-a');\n    const duelB = document.getElementById('duel-b');\n    const duelSa = document.getElementById('duel-sa');\n    const duelSb = document.getElementById('duel-sb');\n    const duelMode = document.getElementById('duel-mode');\n    const duelError = document.getElementById('duel-error');\n    const duelForm = document.getElementById('duel-form');\n    const duelResult = document.getElementById('duel-result');\n    const duelMessages = document.getElementById('duel-messages');\n\n    function openDuel() {\n      const players = getPlayers().sort((x, y) => x.name.localeCompare(y.name, 'fr'));\n      if (players.length < 2) {\n        alert('Il faut au moins 2 joueurs dans le classement pour lancer un duel.');\n        return;\n      }\n      [duelA, duelB].forEach(sel => {\n        sel.innerHTML = '';\n        players.forEach(p => {\n          const opt = document.createElement('option');\n          opt.value = p.key;\n          opt.textContent = p.name;\n          sel.appendChild(opt);\n        });\n      });\n      duelB.selectedIndex = 1;\n      duelSa.value = '';\n      duelSb.value = '';\n      duelMode.value = 'score';\n      duelError.textContent = '';\n      duelForm.classList.remove('col-hidden');\n      duelResult.classList.add('col-hidden');\n      duelOverlay.classList.add('active');\n    }\n\n    function closeDuel() { duelOverlay.classList.remove('active'); }\n\n    function validateDuel() {\n      const keyA = duelA.value, keyB = duelB.value;\n      if (keyA === keyB) { duelError.textContent = 'Choisis deux joueurs différents.'; return; }\n      const sa = parseFloat(duelSa.value), sb = parseFloat(duelSb.value);\n      if (isNaN(sa) || isNaN(sb) || sa < 0 || sb < 0 || sa > 200 || sb > 200) {\n        duelError.textContent = 'Entre les deux scores (entre 0 et 200 kg).';\n        return;\n      }\n\n      const beforeA = getPlayerStats(keyA), beforeB = getPlayerStats(keyB);\n      const mode = duelMode.value;\n      const wa = beforeA.last.weight, wb = beforeB.last.weight;\n      if (mode === 'ratio' && !(wa > 0 && wb > 0)) {\n        duelError.textContent = 'Le handicap demande le poids de corps des deux joueurs.';\n        return;\n      }\n      duelError.textContent = '';\n\n      const va = mode === 'ratio' ? sa / wa : sa;\n      const vb = mode === 'ratio' ? sb / wb : sb;\n      const winner = va > vb ? keyA : (vb > va ? keyB : null);\n\n      // Les deux scores comptent comme des essais\n      const stamp = Date.now();\n      const mkAttempt = (st, score, suffix) => ({\n        id: `${stamp}_${suffix}`, name: st.last.name, service: st.last.service,\n        category: st.last.category, weight: st.last.weight, score\n      });\n      const attA = mkAttempt(beforeA, sa, 'da'), attB = mkAttempt(beforeB, sb, 'db');\n      participants.push(attA, attB);\n      duels.push({ id: String(stamp), a: keyA, b: keyB, ida: attA.id, idb: attB.id, sa, sb, mode, winner, date: new Date().toISOString() });\n      saveData();\n      saveDuels();\n      renderLeaderboard();\n\n      const afterA = getPlayerStats(keyA), afterB = getPlayerStats(keyB);\n      const fmt = v => mode === 'ratio' ? `${v.toFixed(2)} x` : `${v.toFixed(1)} kg`;\n\n      let html = '';\n      if (winner) {\n        const wName = winner === keyA ? beforeA.name : beforeB.name;\n        html += `<div class=\"big\">🏆 ${escapeHtml(wName)} remporte le duel !<\/div><div>⭐ +1 XP bonus pour le vainqueur<\/div>`;\n      } else {\n        html += `<div class=\"big\">⚖️ Égalité parfaite !<\/div><div style=\"color:var(--text-muted)\">Pas de bonus cette fois.<\/div>`;\n      }\n      html += `<div>${escapeHtml(beforeA.name)} : <strong>${fmt(va)}<\/strong> &nbsp;vs&nbsp; ${escapeHtml(beforeB.name)} : <strong>${fmt(vb)}<\/strong><\/div>`;\n      if (mode === 'ratio') html += `<div style=\"color:var(--text-muted)\">Handicap : grip ÷ poids de corps<\/div>`;\n      html += `<div style=\"color:var(--text-muted)\">Les deux scores comptent comme essais (+1 XP chacun).<\/div>`;\n      [[beforeA, afterA, sa], [beforeB, afterB, sb]].forEach(([b, a, score]) => {\n        const label = `${escapeHtml(b.name)} : `;\n        if (score > b.best) html += `<div>🔥 ${label}nouveau record, +1 point de force 💪<\/div>`;\n        html += questLines(b, a, label);\n        if (a.level > b.level) html += `<div class=\"big\">🎉 ${label}niveau ${a.level} : ${levelTitle(a.level)} !<\/div>`;\n      });\n\n      duelMessages.innerHTML = html;\n      duelForm.classList.add('col-hidden');\n      duelResult.classList.remove('col-hidden');\n      celebrate([\n        { name: beforeA.name, before: beforeA, after: afterA },\n        { name: beforeB.name, before: beforeB, after: afterB }\n      ]);\n    }\n\n    document.getElementById('duel-btn').addEventListener('click', openDuel);\n    document.getElementById('duel-validate').addEventListener('click', validateDuel);\n    document.getElementById('duel-cancel').addEventListener('click', closeDuel);\n    document.getElementById('duel-close').addEventListener('click', closeDuel);\n    [duelSa, duelSb].forEach(inp => inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') validateDuel(); }));\n    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && duelOverlay.classList.contains('active')) closeDuel(); });\n\n    // ===== Invitation aléatoire à retenter sa chance =====\n    const INVITE_INTERVAL_MS = 30 * 60 * 1000; // 30 minutes\n    const INVITE_DISPLAY_MS = 12000;           // durée d'affichage\n    const inviteOverlay = document.getElementById('invite-overlay');\n    const inviteGif = document.getElementById('invite-gif');\n    const inviteTitle = document.getElementById('invite-title');\n    const inviteSub = document.getElementById('invite-sub');\n    const inviteCloseBtn = document.getElementById('invite-close');\n    const inviteToggleBtn = document.getElementById('invite-toggle-btn');\n    const inviteNowBtn = document.getElementById('invite-now-btn');\n\n    let inviteTimer = null;\n    let inviteHideTimeout = null;\n    let lastInvitedKey = null;\n    let invitesEnabled = true;\n\n    // Joueurs uniques (par nom) avec leur meilleur score\n    function getUniquePlayers() {\n      const map = new Map();\n      participants.forEach(p => {\n        const key = p.name.trim().toLowerCase();\n        const existing = map.get(key);\n        if (!existing || p.score > existing.best) {\n          map.set(key, { key, name: p.name.trim(), best: p.score });\n        }\n      });\n      return Array.from(map.values());\n    }\n\n    function hideInvite() {\n      inviteOverlay.classList.remove('active');\n      clearTimeout(inviteHideTimeout);\n    }\n\n    function inviteRandomPlayer() {\n      // Ne pas couper l'animation \"score validé\" en cours\n      if (gifOverlay.classList.contains('active') || challengeOverlay.classList.contains('active') || duelOverlay.classList.contains('active') || resetOverlay.classList.contains('active') || questOverlay.classList.contains('active')) {\n        setTimeout(inviteRandomPlayer, 3000);\n        return;\n      }\n\n      const players = getUniquePlayers();\n      if (players.length === 0) return;\n\n      // Évite d'inviter deux fois de suite la même personne (si possible)\n      let pool = players.filter(pl => pl.key !== lastInvitedKey);\n      if (pool.length === 0) pool = players;\n\n      const chosen = pool[Math.floor(Math.random() * pool.length)];\n      lastInvitedKey = chosen.key;\n\n      inviteTitle.textContent = `${chosen.name}, on t'attend ! 🔥`;\n      inviteSub.textContent = `Retente ta chance et bats ton record de ${chosen.best.toFixed(1)} kg !`;\n\n      // Relance le GIF depuis le début\n      const src = inviteGif.src;\n      inviteGif.src = '';\n      inviteGif.src = src;\n\n      inviteOverlay.classList.add('active');\n      clearTimeout(inviteHideTimeout);\n      inviteHideTimeout = setTimeout(hideInvite, INVITE_DISPLAY_MS);\n    }\n\n    function startInviteTimer() {\n      clearInterval(inviteTimer);\n      inviteTimer = setInterval(inviteRandomPlayer, INVITE_INTERVAL_MS);\n    }\n\n    inviteCloseBtn.addEventListener('click', hideInvite);\n    inviteOverlay.addEventListener('click', (e) => { if (e.target === inviteOverlay) hideInvite(); });\n\n    inviteNowBtn.addEventListener('click', () => {\n      if (participants.length === 0) {\n        alert('Aucun joueur à inviter pour le moment.');\n        return;\n      }\n      inviteRandomPlayer();\n      if (invitesEnabled) startInviteTimer(); // repart pour 30 min\n    });\n\n    inviteToggleBtn.addEventListener('click', () => {\n      invitesEnabled = !invitesEnabled;\n      inviteToggleBtn.textContent = `🔔 Invitations auto (30 min) : ${invitesEnabled ? 'ON' : 'OFF'}`;\n      if (invitesEnabled) {\n        startInviteTimer();\n      } else {\n        clearInterval(inviteTimer);\n        hideInvite();\n      }\n    });\n\n    // ===== Import des participants (CSV) =====\n    const importBtn = document.getElementById('import-btn');\n    const importFile = document.getElementById('import-file');\n\n    // Lecture d'un CSV (gère les champs entre guillemets)\n    function parseCsv(text) {\n      text = text.replace(/^\\uFEFF/, '');\n      const rows = [];\n      let row = [], field = '', inQuotes = false;\n      for (let i = 0; i < text.length; i++) {\n        const c = text[i];\n        if (inQuotes) {\n          if (c === '\"' && text[i + 1] === '\"') { field += '\"'; i++; }\n          else if (c === '\"') { inQuotes = false; }\n          else { field += c; }\n        } else if (c === '\"') { inQuotes = true; }\n        else if (c === ',') { row.push(field); field = ''; }\n        else if (c === '\\n' || c === '\\r') {\n          if (c === '\\r' && text[i + 1] === '\\n') i++;\n          row.push(field); field = '';\n          if (row.some(f => f.trim() !== '')) rows.push(row);\n          row = [];\n        } else { field += c; }\n      }\n      row.push(field);\n      if (row.some(f => f.trim() !== '')) rows.push(row);\n      return rows;\n    }\n\n    function participantsFromCsv(text) {\n      const rows = parseCsv(text);\n      if (rows.length < 2) return [];\n      const result = [];\n      rows.slice(1).forEach((r, i) => {\n        const name = (r[0] || '').trim();\n        const score = parseFloat(r[4]);\n        if (!name || isNaN(score)) return;\n        const weight = parseFloat(r[3]);\n        result.push({\n          id: `${Date.now()}_${i}`,\n          name,\n          service: (r[1] || '').trim(),\n          category: (r[2] || '').trim().toUpperCase() === 'F' ? 'F' : 'H',\n          weight: isNaN(weight) ? null : weight,\n          score\n        });\n      });\n      return result;\n    }\n\n    importBtn.addEventListener('click', () => importFile.click());\n\n    importFile.addEventListener('change', () => {\n      const file = importFile.files[0];\n      if (!file) return;\n      const reader = new FileReader();\n      reader.onload = () => {\n        try {\n          const imported = participantsFromCsv(reader.result);\n          if (imported.length === 0) {\n            alert(\"Aucun participant valide trouvé dans ce fichier.\");\n          } else if (confirm(`Remplacer les ${participants.length} participants actuels par les ${imported.length} du fichier ?${duels.length ? ' Les duels enregistrés seront effacés.' : ''}`)) {\n            participants = imported;\n            duels = [];\n            saveData();\n            saveDuels();\n            renderLeaderboard();\n          }\n        } catch (err) {\n          alert(\"Fichier illisible : \" + err.message);\n        }\n        importFile.value = '';\n      };\n      reader.readAsText(file, 'UTF-8');\n    });\n\n    startInviteTimer();\n\n    renderLevelLegend();\n    renderLeaderboard();\n  <\/script>\n<\/body>\n<\/html>",arm:"<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Arm Arena<\/title>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css\">\n<script src=\"https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js\"><\/script>\n<style>\n:root{--bg:#050811;--card:rgba(15,23,42,.92);--accent:#f59e0b;--text:#f8fafc;--muted:#94a3b8;--border:rgba(255,255,255,.15);--good:#22c55e;--bad:#ef4444;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#050811;--text:#f8fafc}}\n:root[data-theme=\"dark\"]{--bg:#050811;--text:#f8fafc}\n*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}\nbody{background:var(--bg);color:var(--text);min-height:100vh}\n.app{max-width:760px;margin:0 auto;padding:16px}\nheader{text-align:center;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);margin-bottom:14px}\nh1{font-size:2rem;color:var(--accent);letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.9)}\nheader p{color:var(--muted);font-size:.85rem;margin-top:4px}\nnav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}\n.tab{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 2px;font-size:.78rem;cursor:pointer}\n.tab.on{background:var(--accent);color:#
